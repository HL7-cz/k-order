# Náhrada bloků `pages:` a `menu:` v k-order/sushi-config.yaml.
#
# Na rozdíl od img-order je u k-order změna konfigurace nutná, protože čtyři
# stránky dosud neexistovaly a blok `pages:` je v této příručce spravován
# ručně — SUSHI proto stránky sám nedoplní.
#
# Vychází ze stavu repozitáře po commitu f50b405 z 3. 9. 2026, který přidal
# stránky Examples a Changes. Změny proti němu:
# - do `pages:` přidány use-cases, workflow, terminology-considerations
#   a implementation-notes, česky i anglicky,
# - do `pages:` přidána stránka Attatchmant-map.html, na kterou odkazuje
#   Mapování logického modelu u sekcí A.4 a A.5; soubor v repozitáři existuje,
#   ale nebyl uveden v konfiguraci, takže se nepublikoval,
# - v `menu:` odkomentovány Use cases, Workflow, Terminology considerations
#   a Implementation notes,
# - Obligations se nezavádí, k-order pro ni nemá obsah.
#
# `title`, `id` ani `canonical` se nemění, změna názvu příručky je vedena jako
# otevřený bod. Ponechány jsou i původní názvy stránek v `pages:`, včetně
# „Oblasti a obsah“ a „Datová sada - logické modely“, přestože domovská
# stránka na tytéž stránky odkazuje jako na Rozsah použití a obsah
# a Logické modely; sjednocení názvů je vedeno jako otevřený bod.


vu mění a proč. Platí pravidlo, že logický model se nepřejmenovává: narativ drží názvy podle Obecné funkční specifikace, a kde se model liší, je to zaznamenaný rozpor, ne návrh na opravu.", "default": "k-order"};
let IG = (D.default && D.igs[D.default]) ? D.default : Object.keys(D.igs)[0];
let LANG = "cs", CUR = "index";

const suffix = () => LANG === "cs" ? "-cs" : "";
const key = (stem) => IG + "|" + LANG + "|" + stem;

function fillIgSelect(){
  const s = document.getElementById("selIg");
  s.innerHTML = Object.keys(D.igs).map(k =>
    `<option value="${k}">${D.igs[k].label} — ${D.igs[k].sub}</option>`).join("");
  s.value = IG;
}

function renderHead(){
  document.getElementById("igName").textContent = D.igs[IG].full;
  document.getElementById("igSub").textContent  = D.igs[IG].sub;
  document.getElementById("igVer").innerHTML    = "verze " + D.igs[IG].ver + "<br>návrh úprav";
  document.getElementById("pub").innerHTML =
    "<b>Toto není publikovaný IG.</b> " + D.intro;
}

function renderMenu(){
  const m = document.getElementById("menu");
  let h = "";
  D.menu.forEach((g, gi) => {
    const items = g[1].map(st => {
      const t = D.titles[LANG][st];
      const cur = st === CUR ? " cur" : "";
      return `<a class="${cur}" href="#/${IG}/${st}${suffix()}">${t} <code style="font-size:11px">${st}${suffix()}.md</code></a>`;
    }).join("");
    let extra = "";
    h += `<div class="grp" data-g="${gi}"><button>${g[0]} ▾</button><div class="dd">${items}${extra}</div></div>`;
  });
  h += `<div class="grp"><button>About ▾</button><div class="dd">
        <a class="art" href="#">Changes</a><a class="art" href="#">Authors</a>
        <a class="art" href="#">Downloads</a><a class="art" href="#">Dependencies</a>
        <a class="art" href="#">Copyright</a></div></div>`;
  h += `<span class="flat">Artifacts</span><span class="sp2"></span><a class="flat homelink" href="#/${IG}/_home" style="color:#cfe0f2">Přehled návrhu</a>`;
  m.innerHTML = h;
  m.querySelectorAll(".grp>button").forEach(b => {
    b.onclick = e => {
      const p = b.parentElement, was = p.classList.contains("on");
      m.querySelectorAll(".grp").forEach(x => x.classList.remove("on"));
      if (!was) p.classList.add("on");
      e.stopPropagation();
    };
  });
}
document.addEventListener("click", () =>
  document.querySelectorAll("nav.mainmenu .grp").forEach(x => x.classList.remove("on")));

function chgBox(list){
  if (!document.getElementById("chkChg").checked) return "";
  if (!list || !list.length)
    return `<details class="chg none"><summary>Co se na této stránce mění — bez věcné změny</summary>
            <div class="in"><p>Tato stránka se proti dnešnímu stavu nemění, nebo jen kosmeticky.</p></div></details>`;
  return `<details class="chg" open><summary>Co se na této stránce mění (${list.length})</summary>
          <div class="in"><ul>${list.map(x => "<li>" + x + "</li>").join("")}</ul></div></details>`;
}

function renderGone(which){
  const k = IG + "|" + which;
  const list = (D.removed && D.removed[k]) || [];
  document.getElementById("crumb").innerHTML =
    `Table of Contents &nbsp;›&nbsp; <b>Zrušená stránka: ${which}</b>`;
  document.getElementById("view").innerHTML = `
    <div class="cols"><main>
      <div class="gonepage"><h3>Tato stránka se ruší: <code>${which}${suffix()}.md</code></h3>
      <ul>${list.map(x => "<li>" + x + "</li>").join("")}</ul></div>
    </main><aside></aside></div>`;
}

function render(){
  renderHead(); renderMenu();
  if (CUR.startsWith("_gone-")) { renderGone(CUR.slice(6)); return; }
  const p = D.pages[key(CUR)];
  if (!p) { document.getElementById("view").innerHTML =
    '<div class="cols"><main><p>Stránka není v náhledu.</p></main></div>'; return; }

  document.getElementById("crumb").innerHTML =
    `Table of Contents &nbsp;›&nbsp; <b>${p.title}</b> &nbsp;<code style="font-size:11px">${p.file}</code>`;

  const toc = p.toc.length ? `<div class="toc"><div class="h">Contents:</div><ul>${
      p.toc.map(t => `<li class="l${t.l}"><a href="#${t.s}">${t.t}</a></li>`).join("")}</ul></div>` : "";

  document.getElementById("view").innerHTML =
    `<div class="cols"><main>${chgBox(p.changes)}<h2><span class="secno">${p.num}</span> ${p.title}</h2>${p.body}</main><aside>${toc}</aside></div>`;
  window.scrollTo(0, 0);
}

function landing(){
  renderHead(); renderMenu();
  document.getElementById("crumb").innerHTML = "<b>Přehled návrhu</b>";
  const cards = Object.keys(D.igs).map(ig => `
    <div class="card"><h4>${D.igs[ig].label}</h4><div class="s">${D.igs[ig].sub}</div>
    <ol>${D.order.map(st => `<li><a href="#/${ig}/${st}${suffix()}">${D.titles[LANG][st]}</a></li>`).join("")}</ol>
    </div>`).join("");
  document.getElementById("view").innerHTML = `<div class="landing">
    <h2>Návrh narativní části — přehled</h2>
    <p>Osm obsahových stránek u každé příručky, v české i anglické verzi. Vyber stránku,
       nebo přepni příručku a jazyk v horním proužku. Na každé stránce je nahoře zelený
       rámeček s tím, co se proti dnešnímu stavu mění a proč.</p>
    <div class="cards">${cards}</div>
  </div>`;
}

function go(ig, stem, lang){
  if (D.igs[ig]) IG = ig;
  if (lang) LANG = lang;
  CUR = stem;
  document.getElementById("selIg").value = IG;
  document.getElementById("selLang").value = LANG;
  try { history.replaceState(null, "", "#/" + IG + "/" + CUR + suffix()); } catch(e) {}
  if (CUR === "_home") landing(); else render();
}

function parseTarget(href){
  const parts = href.replace(/^#\//, "").split("/");
  if (parts.length < 2) return null;
  let stem = parts[1], lang = LANG;
  if (stem.endsWith("-cs")) { lang = "cs"; stem = stem.slice(0, -3); }
  else if (!stem.startsWith("_gone-")) { lang = "en"; }
  return { ig: parts[0], stem: stem, lang: lang };
}

document.querySelector(".wrap").addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (href.startsWith("#/")) {
    e.preventDefault();
    const t = parseTarget(href);
    if (t) go(t.ig, t.stem, t.lang);
  } else if (href.startsWith("#") && href.length > 1) {
    e.preventDefault();
    const el = document.getElementById(href.slice(1));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (href === "#") {
    e.preventDefault();
  }
});

function route(){
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("/")) {
    const t = parseTarget("#" + h);
    if (t) { go(t.ig, t.stem, t.lang); return; }
  }
  go(IG, "_home", LANG);
}

document.getElementById("selIg").onchange = e => go(e.target.value, CUR, LANG);
document.getElementById("selLang").onchange = e => go(IG, CUR, e.target.value);
document.getElementById("chkChg").onchange = () => { if (CUR === "_home") landing(); else render(); };
window.addEventListener("hashchange", route);
fillIgSelect(); route();
</script>
</body>
</html>

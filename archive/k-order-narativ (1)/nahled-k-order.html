The skeleton and the element numbering are common to all types of eReferral, including those published in other implementation guides. The element <code>A.1.7</code> therefore denotes the same data item regardless of the type.</p>\n<h5 id=\"the-two-parts-of-an-ereferral\"><span class=\"secno\">1.1.2</span> The two parts of an eReferral</h5>\n<p>From the interface point of view an eReferral consists of two parts.</p>\n<table class=\"grid\">\n<thead><tr><th>Part</th><th>What it carries</th><th>Where it is described</th></tr></thead><tbody>\n<tr><td>System header</td><td>The type of the referral, the requester, the patient, the addressee, the additional recipients of the result and the reference to a parent referral. It carries no clinical content and may change during the lifecycle.</td><td>Standard of the eReferral System, schema in the OpenAPI specification</td></tr>\n<tr><td>FHIR Bundle of type <code>document</code></td><td>All the clinical content of the document. It is assembled and signed at issue and does not change for the whole lifecycle of the eReferral.</td><td><strong>This guide</strong>, the General Functional Specification of the eReferral Document and the Special Functional Specification of the given type</td></tr>\n</tbody></table>\n<p><strong>This guide describes only the FHIR Bundle.</strong> It does not describe the system header.</p>\n<p>This guide does not describe the method of exchange of the document.</p>\n<h5 id=\"relationship-to-the-rest-of-the-documentation\"><span class=\"secno\">1.1.3</span> Relationship to the rest of the documentation</h5>\n<p>The documentation of eReferrals is divided into the set below.</p>\n<table class=\"grid\">\n<thead><tr><th>Document</th><th>What it describes</th></tr></thead><tbody>\n<tr><td>Standard „Systém eŽádanka“ (Standard of the eReferral System)</td><td>The eReferral system as a whole: actors, roles and permissions, architecture, state model and lifecycle, processes and interface operations, integrations, cyber security and operating conditions.</td></tr>\n<tr><td>Obecná funkční specifikace dokumentu eŽádanka (General Functional Specification of the eReferral Document)</td><td>The content and the properties of the eReferral document common to all types.</td></tr>\n<tr><td>Funkční specifikace eŽádanky K (Special Functional Specification of eReferral type K)</td><td>The specifics of type K: clinical scenarios, type-specific content requirements, the mapping table to the data interface and the type-specific value sets.</td></tr>\n<tr><td>Funkční specifikace eŽádanky FT (Special Functional Specification of eReferral type FT)</td><td>The same for type FT, including the rules of both models of prescription.</td></tr>\n<tr><td>Implementation specification (this guide for types K and FT)</td><td>The complete logical model, the mapping to FHIR resources and profiles, the structure of the FHIR Bundle, the value sets and their code systems, examples of instances.</td></tr>\n<tr><td>OpenAPI specification of the interface</td><td>The data schemas of the interface: fields, data types, cardinalities, examples and error responses.</td></tr>\n</tbody></table>\n<p>Each type of eReferral has its own special functional specification. Where this guide refers to the Special Functional Specification of the given type, it therefore means <em>Funkční specifikace eŽádanky K</em> for type K and <em>Funkční specifikace eŽádanky FT</em> for type FT.</p>\n<h4 id=\"brief-overview\"><span class=\"secno\">1.2</span> Brief Overview</h4>\n<p>This guide is divided into several pages, which are listed at the top of each page in the menu bar.</p>\n<ul>\n<li><a href=\"#/k-order/index\">Home</a>: This page provides introductory information, the relationship to the rest of the documentation, a brief overview, references, dependencies, a version comparison, and an intellectual property statement.</li>\n<li>Introduction:</li>\n<ul>\n<li><a href=\"#/k-order/scope-and-content\">Scope and Content</a>: This section defines what the guide covers and what it does not, and states the skeleton of the logical model of the document.</li>\n<li><a href=\"#/k-order/background\">Background</a>: This section contains information about the origins of the definition of the consultation order and the physiotherapy order.</li>\n</ul>\n<li>Functional:</li>\n<ul>\n<li><a href=\"#/k-order/use-cases\">Use cases</a>: This section refers to the clinical scenarios and to the instances that realise them.</li>\n<li><a href=\"#/k-order/workflow\">Workflow</a>: This section defines what is and what is not a state of an eReferral.</li>\n<li><a href=\"#/k-order/logical-models\">Logical Models</a>: This section contains the list of logical models with the numbers and names of the elements.</li>\n<li><a href=\"#/k-order/terminology-considerations\">Terminology considerations</a>: This section contains information about the code systems and value sets used.</li>\n</ul>\n<li>Implementation:</li>\n<ul>\n<li><a href=\"#/k-order/model-map\">Logical Model Mapping</a>: This section contains the mapping of the logical model to the profiles.</li>\n<li><a href=\"#/k-order/examples\">Examples</a>: This section contains examples of instances.</li>\n<li><a href=\"#/k-order/implementation-notes\">Implementation notes</a>: This section contains information for implementation.</li>\n</ul>\n<li>About:</li>\n<ul>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Changes</span>: This section contains an overview of the changes in the individual versions of the guide.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Authors</span>: This section contains information about the authors.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Downloads</span>: This section contains information about options for downloading the implementation specification content.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Dependencies</span>: This section contains information about the dependencies.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Copyright</span>: This section contains information about the copyright.</li>\n</ul>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Artifacts</span>: This page provides a list of FHIR artifacts defined as part of this implementation guide.</li>\n</ul>\n<h4 id=\"references\"><span class=\"secno\">1.3</span> References</h4>\n<p>The paper templates are the <strong>Referral for examination/treatment of type K</strong> and the <strong>Referral for physiotherapy/occupational therapy of type FT</strong>. The content requirements for a request for further health services are laid down in <code>Annex No. 1, Part 2 to Decree No. 444/2024 Coll., on medical records</code>, as in force on 19 February 2025.</p>\n<ul>\n<li>Related specifications:</li>\n<ul>\n<li><a href=\"https://hl7.cz/fhir/img-order/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Imaging Order FHIR IG</a></li>\n<ul>\n<li>The sister guide of the same documentation set. It shares the skeleton of the logical model and the element numbering with this guide.</li>\n</ul>\n<li><a href=\"http://build.fhir.org/ig/Xt-EHR/xt-ehr-common/index.html\" target=\"_blank\" rel=\"noopener\">EHDS Logical Information Models</a></li>\n<ul>\n<li>This specification inspired many of the design patterns defined in this IG.</li>\n</ul>\n<li><a href=\"http://build.fhir.org/ig/HL7-cz/lab-order/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Laboratory Order IG</a></li>\n<ul>\n<li>This specification shares common design principles for electronic requisition forms.</li>\n</ul>\n<li><a href=\"http://build.fhir.org/ig/HL7-cz/img/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Imaging Report IG</a></li>\n<ul>\n<li>This specification shares common design principles for electronic requisition forms.</li>\n</ul>\n<li><a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a></li>\n<ul>\n<li>Where possible, specifications were inherited from the CZ Core definitions.</li>\n</ul>\n</ul>\n</ul>\n<h4 id=\"dependencies\"><span class=\"secno\">1.4</span> Dependencies</h4>\n<div class=\"gen\">Zde publikátor IG vygeneruje blok <code>dependency-table.xhtml</code>.</div>\n<h4 id=\"cross-version-analysis\"><span class=\"secno\">1.5</span> Cross-Version Analysis</h4>\n<div class=\"gen\">Zde publikátor IG vygeneruje blok <code>cross-version-analysis.xhtml</code>.</div>\n<h4 id=\"intellectual-property-statements\"><span class=\"secno\">1.6</span> Intellectual Property Statements</h4>\n<div class=\"gen\">Zde publikátor IG vygeneruje blok <code>ip-statements.xhtml</code>.</div>", "num": 1, "toc": [{"l": 3, "t": "Introduction", "s": "introduction"}, {"l": 4, "t": "Common skeleton and type-specific differences", "s": "common-skeleton-and-type-specific-differences"}, {"l": 4, "t": "The two parts of an eReferral", "s": "the-two-parts-of-an-ereferral"}, {"l": 4, "t": "Relationship to the rest of the documentation", "s": "relationship-to-the-rest-of-the-documentation"}, {"l": 3, "t": "Brief Overview", "s": "brief-overview"}, {"l": 3, "t": "References", "s": "references"}, {"l": 3, "t": "Dependencies", "s": "dependencies"}, {"l": 3, "t": "Cross-Version Analysis", "s": "cross-version-analysis"}, {"l": 3, "t": "Intellectual Property Statements", "s": "intellectual-property-statements"}], "title": "Home", "file": "index.md", "changes": ["Nový Úvod: příručka je implementační specifikací dvou typů eŽádanky, K a FT. Zachována původní teze o společné bázi požadavkových dokumentů i o budoucím rozšíření o další typy. Doplněno zákonné vymezení eŽádanky s odkazem na Reference.", "Nové: pododdíl Společná kostra a typové odlišnosti — sdílené sekce A.1, A.2, A.4 a A.5 a typový prvek A.3.2. Uvádí, že kostra i číslování prvků jsou společné všem typům eŽádanky, tedy i těm z jiných příruček, ale konkrétní jiný typ nejmenuje.", "Nové: pododdíl Dvě části eŽádanky — systémová hlavička a FHIR Bundle, s větou, že příručka popisuje pouze bundle.", "Nové: pododdíl Vztah k ostatní dokumentaci s tabulkou šesti dokumentů. Speciální funkční specifikace jsou uvedeny jako dvě samostatné, Funkční specifikace eŽádanky K a Funkční specifikace eŽádanky FT, a je výslovně řečeno, že odkaz na Speciální funkční specifikaci příslušného typu znamená u typu K jednu a u typu FT druhou.", "Zachován původní nadpis Stručný rozsah. Rozpis stránek doplněn o pět nových stránek a o oddíl About podle konfigurace příručky.", "Reference: doplněny oba papírové vzory, Poukaz typu K i Poukaz typu FT, a vyhláška č. 444/2024 Sb. Originál uváděl jen obecnou větu o příslušných typech zdravotnických formulářů.", "Vypuštěna věta o hlavním cíli příručky a o zajištění jednotného přístupu k reprezentaci. Co příručka definuje, je nově řečeno věcně v jednom odstavci.", "Vypuštěny zmínky o typu Z. Sesterská příručka je v Referencích uvedena jako příručka téže sady dokumentace, se kterou se sdílí kostra modelu a číslování prvků, bez uvádění typu, který pokrývá. Dosud se obě příručky navzájem neodkazovaly vůbec.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|scope-and-content": {"body": "<h4 id=\"scope\"><span class=\"secno\">2.1</span> Scope</h4>\n<h5 id=\"included-areas\"><span class=\"secno\">2.1.1</span> Included Areas</h5>\n<p>This guide covers the <strong>eReferral of type K, the consultation order</strong>, and the <strong>eReferral of type FT, the physiotherapy order</strong>. Both types share the skeleton of the logical model and the element numbering and differ only in the element <code>A.3.2 Order data elements</code>.</p>\n<p>The <strong>consultation order</strong> is a referral whose subject is an expert assessment or a procedure within the competence of a specialist and whose result is a clinical document, typically a consultation or an outpatient report.</p>\n<p>The <strong>physiotherapy order</strong> is a referral for physiotherapy or occupational therapy in a patient with a functional disorder that therapy can influence. Specific to this type is the choice between two models of prescription: the treating physician either writes out the specific requested procedures, their number and frequency, or states only the category of the requested care, that is physiotherapy or occupational therapy, and delegates the composition of the therapeutic plan to a therapist with specialised competence. The content rules of both models are stated in the Special Functional Specification of eReferral type FT.</p>\n<p>In both types more than one service can be requested on a single eReferral, because the element <code>A.3.2.1 Requested examination</code> has the cardinality <code>1..*</code>. The value sets by which the requested care is expressed are stated on the <a href=\"#/k-order/terminology-considerations\">Terminology considerations</a> page.</p>\n<h5 id=\"excluded-areas\"><span class=\"secno\">2.1.2</span> Excluded Areas</h5>\n<p>This guide does not address the overall ecosystem of eReferrals nor the method of their transport. It further does not cover:</p>\n<ul>\n<li>the <strong>other types of eReferral</strong> — they have their own implementation guides, see <a href=\"https://hl7.cz/fhir/img-order/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Imaging Order FHIR IG</a>,</li>\n<li>the <strong>behaviour of the eReferral system</strong> — the states and their transitions, the interface operations, the permissions, the notifications and the operating conditions are described in the Standard of the eReferral System,</li>\n<li>the <strong>system header of the eReferral</strong> — this guide describes only the FHIR Bundle, see <a href=\"#/k-order/index\">Home</a>,</li>\n<li><strong>clinical scenarios and type-specific content requirements</strong> — they are in the Special Functional Specification of the given type, that is in Funkční specifikace eŽádanky K and in Funkční specifikace eŽádanky FT,</li>\n<li><strong>reporting and reimbursement of the requested care</strong> — the mapping to the data interface of the health insurance companies is in the Special Functional Specification of the given type,</li>\n<li>the <strong>therapeutic plan composed by the therapist</strong> — in the model with a delegated scope the therapist records it in their own medical records, not in the eReferral.</li>\n</ul>\n<h4 id=\"content\"><span class=\"secno\">2.2</span> Content</h4>\n<h5 id=\"information-models\"><span class=\"secno\">2.2.1</span> Information Models</h5>\n<h6 id=\"conceptual-view\"><span class=\"secno\">2.2.1.1</span> Conceptual view</h6>\n<p>The skeleton of the logical model is uniform for all types of eReferral and the same element numbers are used in it. An element number, for example <code>A.1.7</code>, denotes the same data item regardless of the type of eReferral and regardless of the implementation guide in which it is defined. Items of the logical model are therefore referenced <strong>by element number and name</strong>, not by model name.</p>\n<table class=\"grid\">\n<thead><tr><th>Number</th><th>Section</th><th>What it contains</th><th>Who defines it</th></tr></thead><tbody>\n<tr><td><code>A.1</code></td><td>Document header</td><td>Administrative data.</td><td>common to all types</td></tr>\n<tr><td><code>A.2</code></td><td>Document body</td><td>Order information and its reason, the clinical event, the coverage, the appointment and the specimen information.</td><td>common to all types</td></tr>\n<tr><td><code>A.3</code></td><td>Supporting information and data elements</td><td>Supporting clinical information and the definition of the requested care. The element <code>A.3.2</code> is type-specific.</td><td>partly common, <code>A.3.2</code> differs for K and for FT</td></tr>\n<tr><td><code>A.4</code></td><td>Presented form</td><td>The human-readable form of the document.</td><td>common to all types</td></tr>\n<tr><td><code>A.5</code></td><td>Attachments</td><td>Attachments enclosed with the eReferral.</td><td>common to all types</td></tr>\n</tbody></table>\n<p>The guide defines the skeleton as a separate model, <strong>General order</strong>, and two type-specific models on top of it, <strong>K-order</strong> and <strong>FT-order</strong>. These differ from each other only in the model used for the document body.</p>\n<h6 id=\"order-form-structure\"><span class=\"secno\">2.2.1.1.1</span> Order Form Structure</h6>\n<div class=\"diag\"><div class=\"diag-h\">Diagram <code>orderDiagram-cz.plantuml</code> — struktura</div>\n<ul>\n<li class=\"leaf\">Žádanka</li>\n<ul>\n<li class=\"node\">Hlavička žádanky</li>\n<li class=\"node\">Tělo žádanky</li>\n<li class=\"node\">Vizuální podoba dokumentu</li>\n<li class=\"node\">Přílohy</li>\n</ul>\n</ul>\n</div>\n<h6 id=\"order-form-header\"><span class=\"secno\">2.2.1.1.2</span> Order Form Header</h6>\n<div class=\"diag\"><div class=\"diag-h\">Diagram <code>orderHeaderDiagram.plantuml</code> — struktura</div>\n<ul>\n<li class=\"node\">Hlavička obrazové žádanky</li>\n<ul>\n<li class=\"node\">Identifikace pacienta</li>\n<li class=\"node\">Zdravotní pojištění</li>\n<li class=\"node\">Úhrada</li>\n<li class=\"node\">Metadata dokumentu</li>\n<ul>\n<li class=\"leaf\">ID dokumentu</li>\n<li class=\"leaf\">Kategorie dokumentu</li>\n<li class=\"leaf\">Stav žádanky</li>\n<li class=\"leaf\">Datum a čas vytvoření</li>\n<li class=\"leaf\">Název dokumentu</li>\n<li class=\"leaf\">Správce dokumentu</li>\n<li class=\"leaf\">Důvěrnost dokumentu</li>\n<li class=\"leaf\">Jazyk dokumentu</li>\n<li class=\"leaf\">Verze dokumentu</li>\n</ul>\n<li class=\"node\">Objednatel</li>\n<li class=\"node\">Provádějící</li>\n<li class=\"node\">Příjemce nálezu</li>\n<li class=\"node\">Elektronické podpisy</li>\n<ul>\n<li class=\"leaf\">Elektronický podpis nebo pečeť dokumentu</li>\n<li class=\"leaf\">Časové razítko</li>\n</ul>\n</ul>\n</ul>\n</div>\n<h6 id=\"order-body\"><span class=\"secno\">2.2.1.1.3</span> Order Body</h6>\n<div class=\"diag\"><div class=\"diag-h\">Diagram <code>orderBodyDiagram.plantuml</code> — struktura</div>\n<ul>\n<li class=\"node\">Tělo Obecné žádanky</li>\n<ul>\n<li class=\"node\">Informace o žádance</li>\n<li class=\"node\">Klinická událost</li>\n<li class=\"node\">Úhrada</li>\n<li class=\"node\">Termín vyšetření</li>\n<li class=\"node\">Informace o vzorku</li>\n<li class=\"node\">Klinické informace</li>\n<ul>\n<li class=\"leaf\">Biometrické údaje</li>\n<li class=\"leaf\">Váha</li>\n<li class=\"leaf\">Výška</li>\n<li class=\"leaf\">Urgentní informace</li>\n<ul>\n<li class=\"leaf\">Alergie a intolerance</li>\n<li class=\"leaf\">Varování</li>\n</ul>\n<li class=\"leaf\">Medikace</li>\n<li class=\"leaf\">Implantáty</li>\n<li class=\"leaf\">Omezení pohyblivosti pacienta</li>\n<li class=\"leaf\">Další relevantní klinické informace</li>\n<li class=\"leaf\">Očkování</li>\n<li class=\"leaf\">Datum hospitalizace</li>\n<li class=\"leaf\">Další formalizované údaje</li>\n</ul>\n<li class=\"node\">Datové elementy objednávky vyšetření</li>\n<ul>\n<li class=\"leaf\">Kod vyšetření</li>\n<li class=\"leaf\">Název vyšetření</li>\n<li class=\"leaf\">FT-Počet</li>\n<li class=\"leaf\">FT-Frekvence</li>\n<li class=\"leaf\">FT-Místo poskytnutí péče</li>\n<li class=\"leaf\">FT-Část těla</li>\n<li class=\"leaf\">FT-Lateralita</li>\n<li class=\"leaf\">Poznámka</li>\n<li class=\"leaf\">K-Závažná anamnestická data (text)</li>\n<li class=\"leaf\">K-Výsledky vyšetření (text)</li>\n<li class=\"leaf\">K-Diagnostická rozvaha (text)</li>\n<li class=\"leaf\">K-Současná léčba (text)</li>\n<li class=\"leaf\">K-Zapůjčená dokumentace (text)</li>\n</ul>\n<li class=\"node\">Odkazy na objednávky plánované péče navazující na tuto žádanku </li>\n<li class=\"node\">Ostatní podpůrné informace </li>\n</ul>\n</ul>\n</div>\n<h5 id=\"subject\"><span class=\"secno\">2.2.2</span> Subject</h5>\n<p>The patient, the healthcare practitioner and the healthcare provider are defined in <a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a> and this guide only uses them. The patient profile localises the basic concepts including identifiers and terminology for use in the Czech context, the practitioner profile makes it possible to assign a role to a person, and the provider profile defines the way an organisation is represented, including superior and subordinate departments.</p>\n<h5 id=\"objects\"><span class=\"secno\">2.2.3</span> Objects</h5>\n<p>The medical device and the medical product are also defined in <a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a>. The same holds for components shared by several documents, for example the body measurements, which are defined identically across documents.</p>\n<h4 id=\"order-structure\"><span class=\"secno\">2.3</span> Order structure</h4>\n<p>The following sections state the elements of the individual sections of the skeleton. The complete list of elements with their cardinalities, data types and value sets is on the <a href=\"#/k-order/logical-models\">Logical models</a> page, the mapping to FHIR profiles on the <a href=\"#/k-order/model-map\">Logical Model Mapping</a> page.</p>\n<h5 id=\"document-header\"><span class=\"secno\">2.3.1</span> Document header</h5>\n<p>The header is identical for both types.</p>\n<table class=\"grid\">\n<thead><tr><th>Number</th><th>Element</th><th>What it carries</th></tr></thead><tbody>\n<tr><td><code>A.1.1</code></td><td>Patient identification</td><td>The sectoral identifier and the identification data of the patient.</td></tr>\n<tr><td><code>A.1.2</code></td><td>Patient contact information</td><td>The address, the contact details and the contact persons. The type of contact person distinguishes emergency contacts, legal representatives and other persons related to the patient.</td></tr>\n<tr><td><code>A.1.3</code></td><td>Health insurance</td><td>The health insurance company and the insurance relationship of the patient. The insurer need not be the payer of the requested care.</td></tr>\n<tr><td><code>A.1.4</code></td><td>Coverage</td><td>The method of payment for the requested care.</td></tr>\n<tr><td><code>A.1.5</code></td><td>Author</td><td>The requester, that is the provider, the department and the persons who wrote and signed the order.</td></tr>\n<tr><td><code>A.1.6</code></td><td>Requested performer</td><td>The provider of the requested care <strong>recommended at issue</strong>. In a non-addressed eReferral it need not be stated. The actually performing provider is carried by the system header, not by this element.</td></tr>\n<tr><td><code>A.1.7</code></td><td>Additional recipient</td><td>Additional recipients of the result beside the author, as determined by the requester <strong>at issue</strong>. The distribution of the result is governed by the system header, not by this element.</td></tr>\n<tr><td><code>A.1.8</code></td><td>Document metadata</td><td>Data about the document as such, for example its identifier, category, date of creation and custodian.</td></tr>\n<tr><td><code>A.1.9</code></td><td>Electronic signatures</td><td>The electronic signature or seal of the document under Act No. 327/2011 Coll., Section 54a, and the time stamp.</td></tr>\n</tbody></table>\n<p>The elements <code>A.1.1</code> and <code>A.1.2</code> are carried by a single element in the model, because the identification of the patient and their contact information are modelled together.</p>\n<h5 id=\"document-body\"><span class=\"secno\">2.3.2</span> Document body</h5>\n<p>In section <code>A.2</code> the body is identical for both types.</p>\n<table class=\"grid\">\n<thead><tr><th>Number</th><th>Element</th><th>What it carries</th></tr></thead><tbody>\n<tr><td><code>A.2.1</code></td><td>Order information</td><td>The identifier and the date of the order, the requested date of performance, the urgency, the order text and information for the patient.</td></tr>\n<tr><td><code>A.2.2</code></td><td>Order reason</td><td>The indicating diagnosis, the clinical question and the reason for the order, both coded and as text. In the model it is a part of the element <code>A.2.1</code>.</td></tr>\n<tr><td><code>A.2.3</code></td><td>Clinical event</td><td>The context of care to which the order relates, for example the outpatient visit at which the order arose.</td></tr>\n<tr><td><code>A.2.4</code></td><td>Coverage</td><td>Data on the method of payment for the requested care in the body of the document, including payer information and a comment.</td></tr>\n<tr><td><code>A.2.5</code></td><td>Appointment</td><td>The requested or agreed date of performance, its duration, place and instructions for the patient.</td></tr>\n<tr><td><code>A.2.6</code></td><td>Specimen information</td><td>Data on a biological specimen for the cases where its examination is the subject of the request.</td></tr>\n</tbody></table>\n<h5 id=\"supporting-information-and-data-elements\"><span class=\"secno\">2.3.3</span> Supporting information and data elements</h5>\n<table class=\"grid\">\n<thead><tr><th>Number</th><th>Element</th><th>What it carries</th></tr></thead><tbody>\n<tr><td><code>A.3.1</code></td><td>Clinical information</td><td>Data communicated to the provider of the requested care that influence its provision or the interpretation of the result: body measurements, other relevant clinical information, medication, implants, urgent information, restrictions of patient mobility, physical findings, the date of hospitalisation, vaccination and other formalised data.</td></tr>\n<tr><td><code>A.3.2</code></td><td>Order data elements</td><td>The definition of the requested care. The content differs between types K and FT, see below.</td></tr>\n<tr><td><code>A.3.3</code></td><td>Planned care orders</td><td>References to orders of planned care following on from this order.</td></tr>\n<tr><td><code>A.3.4</code></td><td>Other supporting information</td><td>Other supporting information, for example the date by which the result is needed.</td></tr>\n</tbody></table>\n<h6 id=\"order-data-elements-of-the-consultation-order\"><span class=\"secno\">2.3.3.1</span> Order data elements of the consultation order</h6>\n<table class=\"grid\">\n<thead><tr><th>Number</th><th>Element</th><th>What it carries</th></tr></thead><tbody>\n<tr><td><code>A.3.2.1</code></td><td>Requested examination</td><td>The code and the name of the requested service and a note of the author. The block may repeat.</td></tr>\n<tr><td><code>A.3.2.2</code></td><td>Significant medical history</td><td>A textual description of the medical history data significant for the requested care.</td></tr>\n<tr><td><code>A.3.2.3</code></td><td>Examination results</td><td>A summary or selection of the results of examinations already performed that are relevant for clinical decision-making.</td></tr>\n<tr><td><code>A.3.2.4</code></td><td>Differential diagnosis</td><td>The diagnoses considered and their justification.</td></tr>\n<tr><td><code>A.3.2.5</code></td><td>Current treatment, medication including dosage</td><td>An overview of the ongoing treatment including dosage.</td></tr>\n<tr><td><code>A.3.2.6</code></td><td>Referenced documentation</td><td>A list or description of the medical documentation lent with the order.</td></tr>\n</tbody></table>\n<h6 id=\"order-data-elements-of-the-physiotherapy-order\"><span class=\"secno\">2.3.3.2</span> Order data elements of the physiotherapy order</h6>\n<table class=\"grid\">\n<thead><tr><th>Number</th><th>Element</th><th>What it carries</th></tr></thead><tbody>\n<tr><td><code>A.3.2.1</code></td><td>Requested examination</td><td>The code and the name of the requested care, the body part, the laterality, the number, the frequency, a note and the requested place of provision, for example the patient's home. The block may repeat.</td></tr>\n<tr><td><code>A.3.2.2</code></td><td>Goal of the examination</td><td>The goal to be achieved by the therapy.</td></tr>\n</tbody></table>\n<p>In the model of a general indication with a delegated scope the treating physician does not state the specific procedures and expresses the requested care only by its category.</p>\n<h5 id=\"presented-form\"><span class=\"secno\">2.3.4</span> Presented form</h5>\n<p>The human-readable form of the document in the required PDF format. It carries the content type, the language, the title, the data or the URL of the content and the date of creation.</p>\n<h5 id=\"attachments\"><span class=\"secno\">2.3.5</span> Attachments</h5>\n<p>Other attachments by which the structured content may be supplemented, for example outpatient or discharge reports, image documentation or data provided by the patient. An attachment does not replace a structured data item: a data item for which a structured element is defined in the logical model must be stated by that element.</p>\n<p>The attachments of the eReferral must be distinguished from the documents of the consignment by which the result is handed over when the eReferral is completed. Those follow the rules of the Temporary Repository and are unrelated to the body of the eReferral.</p>", "num": 2, "toc": [{"l": 3, "t": "Scope", "s": "scope"}, {"l": 4, "t": "Included Areas", "s": "included-areas"}, {"l": 4, "t": "Excluded Areas", "s": "excluded-areas"}, {"l": 3, "t": "Content", "s": "content"}, {"l": 4, "t": "Information Models", "s": "information-models"}, {"l": 4, "t": "Subject", "s": "subject"}, {"l": 4, "t": "Objects", "s": "objects"}, {"l": 3, "t": "Order structure", "s": "order-structure"}, {"l": 4, "t": "Document header", "s": "document-header"}, {"l": 4, "t": "Document body", "s": "document-body"}, {"l": 4, "t": "Supporting information and data elements", "s": "supporting-information-and-data-elements"}, {"l": 4, "t": "Presented form", "s": "presented-form"}, {"l": 4, "t": "Attachments", "s": "attachments"}], "title": "Scope and content", "file": "scope-and-content.md", "changes": ["Stránka měla 263 B a tvořily ji tři diagramy bez textu. Nově má stejnou osnovu jako img-order: Oblasti řešení, Obsah a Struktura žádanky.", "Původní nadpisy diagramů jsou zachovány — Skladba žádanky, Hlavička žádanky a Tělo žádanky. Přesunuly se pod Koncepční pohled, kde je nově i kostra logického modelu A.1 až A.5.", "Nové: Zahrnuté oblasti vymezují oba typy a u typu FT oba modely preskripce. Obory hodnot, kterými se požadovaná péče vyjadřuje, se tu neuvádějí — vazba na SNOMED CT je pouze `preferred`, takže by na tomto místě definici typu zkreslovala. Odkazuje se na stránku Terminologické aspekty.", "Nové: Nezahrnuté oblasti — ostatní typy eŽádanky bez jmenování konkrétního typu, chování systému eŽádanky, systémová hlavička, klinické scénáře, vykazování a úhrada, a terapeutický plán sestavený terapeutem v modelu s delegovaným rozsahem.", "Nové: tabulky prvků A.1.1 až A.1.9, A.2.1 až A.2.6 a A.3.1 až A.3.4, a k tomu dvě typové tabulky prvku A.3.2, jedna pro konziliární žádanku a jedna pro žádanku o fyzioterapii.", "U prvků A.1.6 a A.1.7 je doplněno, že chování systému řídí systémová hlavička, ne tyto prvky.", "Doplněno, že prvky A.1.1 a A.1.2 nese v modelu jeden prvek a že prvek A.2.2 je v modelu součástí prvku A.2.1. Bez toho čísla prvků v modelu nedohledáte.", "Prvek A.1.6 se nazývá Provádějící a sekce A.4 Prezentovaná forma, tedy tak, jak je nazývají modely dokumentu a jak je nazývá Obecná funkční specifikace. Samotný model sekce A.4 je nazván Vizuální podoba dokumentu, viz otevřené body. Model se podle pravidla z 4. 9. nepřejmenovává.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|background": {"body": "<h4 id=\"k-and-ft-order\"><span class=\"secno\">3.1</span> K and FT Order</h4>\n<p>The paper templates for these two types of eReferral are the <strong>Referral for examination/treatment of type K</strong> and the <strong>Referral for physiotherapy/occupational therapy of type FT</strong>. The current versions of the forms are available on the <a href=\"https://www.vzp.cz/poskytovatele/tiskopisy\" target=\"_blank\" rel=\"noopener\">VZP – forms for providers</a> pages.</p>\n<p>Like other healthcare documents, both types use the standards and terminology systems used in the Czech and the European e-health environment. These are in particular HL7 FHIR, SNOMED CT, ICD-10 and national code systems and identifiers, and for the requested procedures also the code systems of the health insurance companies. An overview of the code systems and value sets used is on the <a href=\"#/k-order/terminology-considerations\">Terminology considerations</a> page.</p>\n<p>The content requirements for a request for further health services are laid down in <code>Annex No. 1, Part 2 to Decree No. 444/2024 Coll., on medical records</code>. As in force on 19 February 2025, a request for further health services contains:</p>\n<ul class=\"legis\">\n<li>a) the requested health services,</li>\n<li>b) the justification of the request,</li>\n<li>c) the urgency of the request,</li>\n<li>d) data on the most recently established state of health, including those results of laboratory and other supporting examinations that are essential for the provision of the requested health services,</li>\n<li>e) data on the treatment provided so far and the response of the patient to it,</li>\n<li>f) the working diagnosis,</li>\n<li>g) the essential anamnestic data related to the requested health services.</li>\n</ul>\n<p>This implementation guide translates these legislative requirements into an interoperable electronic form based on the HL7 FHIR R4 standard. Which elements of the logical model satisfy the individual requirements is stated in the Special Functional Specification of the given type, that is in Funkční specifikace eŽádanky K and in Funkční specifikace eŽádanky FT.</p>", "num": 3, "toc": [{"l": 3, "t": "K and FT Order", "s": "k-and-ft-order"}], "title": "Background", "file": "background.md", "changes": ["Zachován původní nadpis Poukaz K a FT.", "Vypuštěny tři odstavce, které se překrývají s Domovskou stránkou a s Rozsahem použití: společná báze a odlišnost v části body, popis obou typů a odstavec o cíli sjednotit reprezentaci požadavkových dokumentů.", "Doplněn papírový vzor typu FT. Originál uváděl jen Poukaz typu K a související formuláře.", "Výčet obsahu vyžádání podle vyhlášky č. 444/2024 Sb. je nově strukturovaný seznam a) až g) podle znění přílohy. Dosud to byl volný výčet bez označení bodů.", "Doplněn odkaz na stránku Terminologické aspekty a věta, že které prvky modelu jednotlivé požadavky naplňují, uvádí obě speciální funkční specifikace.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|use-cases": {"body": "<p>The use cases and clinical scenarios are described in the special functional specifications of both types: <strong>Funkční specifikace eŽádanky K</strong> for the consultation order and <strong>Funkční specifikace eŽádanky FT</strong> for the physiotherapy order. This guide does not repeat them. The location of the documents is stated on the <a href=\"#/k-order/index\">Home</a> page, section Relationship to the rest of the documentation.</p>\n<p>The instances that realise the individual scenarios are on the <a href=\"#/k-order/examples\">Examples</a> page.</p>", "num": 4, "toc": [], "title": "Use cases", "file": "use-cases.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Dva odstavce: případy užití a klinické scénáře popisují Funkční specifikace eŽádanky K a Funkční specifikace eŽádanky FT, příručka je neopisuje, a instance, které je realizují, jsou na stránce Příklady.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|workflow": {"body": "<p>This guide specifies a document, not a process. The lifecycle of an eReferral is a property of the system through which the document is exchanged — in the Czech setting it is carried by the system header, and its states, transitions and operations are described in the Standard of the eReferral System. The FHIR Bundle is assembled and signed at issue and does not change afterwards, see <a href=\"#/k-order/implementation-notes\">Implementation notes</a>. Where the document is exchanged in a context other than the eReferral system, the process rules of that context apply.</p>\n<p>Resources in the bundle have their own <code>status</code> elements, for example <code>Composition.status</code> or <code>ServiceRequest.status</code>, and they express the state of the document and of the request at the time of issue.</p>\n<p>The <a href=\"https://hl7.org/fhir/R4/valueset-request-status.html\" target=\"_blank\" rel=\"noopener\">RequestStatus</a> value set is not the state model of an eReferral and must not be presented as one, because its values and the states the eReferral system distinguishes do not match in either direction. The state of the eReferral is carried by the system header, see <a href=\"#/k-order/index\">Home</a>, section The two parts of an eReferral. The same applies to the element <code>A.1.8.3 Document status</code>.</p>", "num": 5, "toc": [], "title": "Workflow", "file": "workflow.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Tři odstavce bez nadpisů. Nese jedinou věc, kterou neříká žádný jiný dokument sady: že prvky status ve zdrojích bundlu nejsou stavem eŽádanky.", "Stavový model se neopisuje. Stavy, přechody a operace popisuje Standard systému eŽádanka, odkazuje se na něj.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|logical-models": {"body": "<p>This page lists HL7 FHIR logical models used to represent the K-ORDERS.</p>\n<p>The skeleton of the logical model is uniform for all types of eReferral, see <a href=\"#/k-order/scope-and-content#conceptual-view\">Scope and content</a>. An element number denotes the same data item regardless of the type of eReferral and regardless of the implementation guide in which it is defined. Items are therefore referenced <strong>by element number and name</strong>, not by model name — model names differ between guides.</p>\n<p>The sections <code>A.1</code>, <code>A.2</code>, <code>A.4</code> and <code>A.5</code> are common to all types of eReferral. Section <code>A.3</code> is completed in the element <code>A.3.2</code> by the model of the particular type.</p>\n<p>The following three models describe the document as a whole. The general order model is the skeleton without type-specific content; the K-order and FT-order models differ from it only in the model used for the document body. These three document-level models are defined once and their titles are in Czech.</p>\n<div class=\"gen\">Zde publikátor IG vygeneruje tabulku logických modelů.</div>\n<p>The following models describe the individual sections and elements. Their titles begin with the element number, by which they are ordered.</p>\n<div class=\"gen\">Zde publikátor IG vygeneruje tabulku logických modelů. Dotaz: <code>Name LIKE 'LMEn%'</code>.</div>\n<p>The Czech version of the models is listed on the Czech version of this page, see <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Logické modely</span>.</p>", "num": 6, "toc": [], "title": "Logical models", "file": "logical-models.md", "changes": ["Doplněno pravidlo, že kostra logického modelu je jednotná napříč typy i příručkami a že se na prvky odkazuje číslem a názvem prvku.", "Doplněno, které sekce jsou společné a že sekci A.3 doplňuje v prvku A.3.2 model konkrétního typu.", "Opraven výběr modelů. Původní tři dotazy na LMG%, LMK% a LMF% vracely pouze tři modely dokumentu, kdežto všech 25 modelů sekcí a prvků má název začínající LMCz% a na stránce se vůbec nezobrazovalo. Nově jeden dotaz vypisuje modely dokumentu a druhý modely sekcí.", "V anglické verzi je druhý dotaz na LMEn%. Anglická sada modelů je menší než česká, viz otevřené body.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|terminology-considerations": {"body": "<p>The following is a list of the code systems and value sets used, organised by terminology source. Every logical model element appears exactly once, in the section of the system that is decisive for it. Where an element also allows another system, that system is named in the Value column as an alternative. Where the value set differs between types K and FT, that is stated with the element.</p>\n<p>National value sets are published by <a href=\"https://hl7.cz/terminology/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Terminology Implementation Guide</a> and their values are available through the <strong>TermX</strong> terminology server. For the code systems of the health insurance companies the authoritative source is the code system package provided under the contractual relationship, publicly published pages are informative only. Where a national value set exists for an element, it is used in preference to an international one.</p>\n<h4 id=\"snomed-ct\"><span class=\"secno\">7.1</span> Snomed-CT</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>A.2.2.2</td><td>Clinical question, coded</td><td>SNOMED CT</td></tr>\n<tr><td>A.2.2.4</td><td>Order reason, coded</td><td>SNOMED CT</td></tr>\n<tr><td>A.3.1.4.1</td><td>Implant type</td><td>SNOMED CT, the value set is determined by the medical device profile in <a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a></td></tr>\n<tr><td>A.3.1.4.4</td><td>Implant – body part</td><td><a href=\"https://hl7.org/fhir/valueset-body-site.html\" target=\"_blank\" rel=\"noopener\">body-site</a>, SNOMED CT Body structure</td></tr>\n<tr><td>A.3.1.6.2</td><td>Mobility restriction – code of the information</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-mobility-type</span> — four codes for the type of the assessed activity: walking, standing up, standing and moving in bed</td></tr>\n<tr><td>A.3.1.6.3</td><td>Mobility restriction – value of the information</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-mobility-value</span> — eight codes of assessment for the types above</td></tr>\n<tr><td>A.3.1.10</td><td>Physical finding</td><td>SNOMED CT, clinical findings</td></tr>\n<tr><td>A.3.1.12</td><td>Vaccination</td><td>SNOMED CT</td></tr>\n<tr><td>A.3.2.1.1</td><td>Examination code</td><td>For type K <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-procedures-vs</span>, descendants of the concept <code>11429006</code> Consultation. For type FT <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-order-procedures-vs</span>, descendants of the concept <code>91251008</code> Physical therapy procedure. In both types the binding is <code>preferred</code>; the procedures of the health insurance companies are an alternative, see below.</td></tr>\n<tr><td>A.3.2.1.3</td><td>Body part of the requested care (FT)</td><td>SNOMED CT, Body structure</td></tr>\n<tr><td>—</td><td>Request category, <code>ServiceRequest.category</code></td><td>For type FT <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-category-service-request</span> — <code>91251008</code> physiotherapy, <code>84478008</code> occupational therapy. The category distinguishes the two models of prescription, because in the model with a delegated scope it is the only expression of the requested care.</td></tr>\n</tbody></table>\n<p>The preferred way of expressing the requested care is SNOMED CT; the preference is expressed by the strength of the binding in the profile. For type FT the SNOMED CT concept <code>91251008</code> is excluded from the value set of requested procedures, because general physiotherapy is expressed by the request category, not by a procedure.</p>\n<h4 id=\"icd-10-orphacode\"><span class=\"secno\">7.2</span> ICD-10 / Orphacode</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>A.2.2.1</td><td>Problem / diagnosis / condition – indicating diagnosis</td><td><a href=\"https://uzis.cz/terminology/ValueSet/mkn-10\" target=\"_blank\" rel=\"noopener\">mkn-10</a> and <a href=\"https://ncez.mzcr.cz/terminology/ValueSet/orphanet-rare-diseases\" target=\"_blank\" rel=\"noopener\">orphanet-rare-diseases</a>, in both types with a <code>preferred</code> binding</td></tr>\n<tr><td>A.3.1.2.1</td><td>Code of the information – secondary diagnosis</td><td><a href=\"https://uzis.cz/terminology/ValueSet/mkn-10\" target=\"_blank\" rel=\"noopener\">mkn-10</a></td></tr>\n</tbody></table>\n<p>The national value set <a href=\"https://ncez.mzcr.cz/terminology/ValueSet/condition-cz\" target=\"_blank\" rel=\"noopener\">condition-cz</a> combines ICD-10, ORPHA and SNOMED CT clinical findings into a single value set and is usable as a whole for the indicating diagnosis.</p>\n<h4 id=\"nclppol\"><span class=\"secno\">7.3</span> NČLPPOL</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>A.3.1.1.1.2</td><td>Weight – code</td><td><a href=\"https://ncez.mzcr.cz/nclp/ValueSet/nclppol\" target=\"_blank\" rel=\"noopener\">nclppol</a> <code>20042</code>, alternatively SNOMED CT <code>27113001</code></td></tr>\n<tr><td>A.3.1.1.2.2</td><td>Height – code</td><td><a href=\"https://ncez.mzcr.cz/nclp/ValueSet/nclppol\" target=\"_blank\" rel=\"noopener\">nclppol</a> <code>20411</code>, alternatively SNOMED CT <code>1153637007</code></td></tr>\n</tbody></table>\n<h4 id=\"code-systems-of-the-health-insurance-companies\"><span class=\"secno\">7.4</span> Code systems of the health insurance companies</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>A.1.4.3</td><td>Reimbursement indicator</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">vzp-nahrady-vs</span> — seven codes of reimbursement for health care, for example an injury caused by another person or an occupational injury</td></tr>\n</tbody></table>\n<p>The procedures of the health insurance companies are an alternative to SNOMED CT for the element <code>A.3.2.1.1 Examination code</code>. The guide defines two code systems for them, <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-vzp-procedures-cs</span> for procedures and <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-vzp-procedures-cs</span> for physiotherapy procedures. Both are marked as a <code>fragment</code> and contain only the demonstration subset of codes used in the examples; the binding source is the code system package of the insurer.</p>\n<h4 id=\"loinc\"><span class=\"secno\">7.5</span> LOINC</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>A.1.8.2</td><td>Document category</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/document-category\" target=\"_blank\" rel=\"noopener\">document-category</a></td></tr>\n<tr><td>—</td><td>Order type, <code>Composition.type</code></td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/referralorder-types\" target=\"_blank\" rel=\"noopener\">referralorder-types</a> — for type K the code <code>57133-1</code>, for type FT the code <code>57154-7</code></td></tr>\n</tbody></table>\n<p>The element <code>Composition.type</code> carries the order type from the national Referral Order Types value set. It is the only element of the header whose value differs between types K and FT. No <code>A.x</code> element is defined for the order type in the logical model, which is why the table gives it no number.</p>\n<h4 id=\"fhir\"><span class=\"secno\">7.6</span> FHIR</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>A.1.1.6</td><td>Citizenship</td><td><a href=\"https://terminology.hl7.org/ValueSet-v3-Country2.html\" target=\"_blank\" rel=\"noopener\">v3-Country2</a></td></tr>\n<tr><td>A.1.1.7</td><td>Gender</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/administrative-gender-cz\" target=\"_blank\" rel=\"noopener\">administrative-gender-cz</a></td></tr>\n<tr><td>A.1.1.9</td><td>Communication language</td><td><a href=\"https://hl7.org/fhir/valueset-all-languages.html\" target=\"_blank\" rel=\"noopener\">all-languages</a></td></tr>\n<tr><td>A.1.2.1</td><td>Address – country</td><td><a href=\"https://terminology.hl7.org/ValueSet-v3-Country2.html\" target=\"_blank\" rel=\"noopener\">v3-Country2</a></td></tr>\n<tr><td>A.1.2.4.1</td><td>Contact type</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/contactrole-cz\" target=\"_blank\" rel=\"noopener\">contactrole-cz</a></td></tr>\n<tr><td>A.1.4.1</td><td>Coverage kind</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/cz-coverage-type\" target=\"_blank\" rel=\"noopener\">cz-coverage-type</a> — <code>HIP</code> health insurance, <code>pay</code> self-payer</td></tr>\n<tr><td>A.1.8.3</td><td>Document status</td><td><a href=\"https://hl7.org/fhir/valueset-composition-status.html\" target=\"_blank\" rel=\"noopener\">composition-status</a> — <code>preliminary</code>, <code>final</code>, <code>amended</code>, <code>entered-in-error</code>. The element maps to <code>Composition.status</code>, where the binding is required already in the base resource and the profile does not narrow it.</td></tr>\n<tr><td>A.1.8.7</td><td>Document confidentiality</td><td><a href=\"https://terminology.hl7.org/ValueSet-v3-Confidentiality.html\" target=\"_blank\" rel=\"noopener\">v3-Confidentiality</a></td></tr>\n<tr><td>A.1.8.8</td><td>Document language</td><td><a href=\"https://hl7.org/fhir/valueset-all-languages.html\" target=\"_blank\" rel=\"noopener\">all-languages</a></td></tr>\n<tr><td>A.2.1.4</td><td>Order urgency</td><td><a href=\"https://hl7.org/fhir/valueset-request-priority.html\" target=\"_blank\" rel=\"noopener\">request-priority</a> — <code>routine</code>, <code>urgent</code>, <code>asap</code>, <code>stat</code>. The guide defines the value set <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-priority-vs</span> for it, with Czech names of the values.</td></tr>\n<tr><td>A.2.4.1</td><td>Coverage kind in the body of the document</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/cz-coverage-type\" target=\"_blank\" rel=\"noopener\">cz-coverage-type</a></td></tr>\n<tr><td>A.2.5.2</td><td>Appointment status</td><td><a href=\"https://hl7.org/fhir/valueset-appointmentstatus.html\" target=\"_blank\" rel=\"noopener\">appointmentstatus</a></td></tr>\n<tr><td>A.4.1, A.5.1</td><td>Content type of the presented form and of an attachment</td><td>MIME type, <a href=\"https://www.rfc-editor.org/rfc/rfc2046\" target=\"_blank\" rel=\"noopener\">urn:ietf:bcp:13</a></td></tr>\n<tr><td>A.4.2, A.5.2</td><td>Content language of the presented form and of an attachment</td><td><a href=\"https://hl7.org/fhir/valueset-all-languages.html\" target=\"_blank\" rel=\"noopener\">all-languages</a></td></tr>\n</tbody></table>\n<p>The element <code>A.1.8.3 Document status</code> expresses the status of the document at the time of issue, not the state of the eReferral in the system. That is a property of the system, not of the document, see <a href=\"#/k-order/workflow\">Workflow</a>.</p>\n<h4 id=\"recommendation-to-take-the-patient-into-care\"><span class=\"secno\">7.7</span> Recommendation to take the patient into care</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>—</td><td>Recommended disposition in type K</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-recommendation-disposition-vs</span> — <code>ambulatory-care</code> taking into care, <code>hospitalization</code> hospitalisation</td></tr>\n</tbody></table>\n<p>In type K the recommended disposition is carried by an extension of the requested service profile and the binding of the value set is <code>required</code>. The scenario of recommending that the patient be taken into ambulatory or inpatient care is described in Funkční specifikace eŽádanky K. No <code>A.x</code> element is defined for this data item in the logical model, which is why the table gives it no number.</p>\n<h4 id=\"ucum\"><span class=\"secno\">7.8</span> UCUM</h4>\n<table class=\"grid\">\n<thead><tr><th>Item code</th><th>Item description</th><th>Value</th></tr></thead><tbody>\n<tr><td>A.3.1.1.1.1</td><td>Weight value – unit</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-observation-units-weight-vs</span> — <code>kg</code>, <code>g</code></td></tr>\n<tr><td>A.3.1.1.2.1</td><td>Height value – unit</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-observation-units-height-vs</span> — <code>m</code>, <code>cm</code></td></tr>\n</tbody></table>\n<h4 id=\"elements-with-no-value-set-bound\"><span class=\"secno\">7.9</span> Elements with no value set bound</h4>\n<p>For the following coded elements the guide does not yet bind a value set, because it has no profile or binding for them: <code>A.1.5</code> the specialty of the author, <code>A.3.1.5.1 Allergies and intolerances</code>, <code>A.3.2.1.4 Laterality</code> in type FT and the coded elements of <code>A.2.6 Specimen information</code>. Until they are bound, the terminology stated in the General Functional Specification of the eReferral Document applies to them.</p>", "num": 7, "toc": [{"l": 3, "t": "Snomed-CT", "s": "snomed-ct"}, {"l": 3, "t": "ICD-10 / Orphacode", "s": "icd-10-orphacode"}, {"l": 3, "t": "NČLPPOL", "s": "nclppol"}, {"l": 3, "t": "Code systems of the health insurance companies", "s": "code-systems-of-the-health-insurance-companies"}, {"l": 3, "t": "LOINC", "s": "loinc"}, {"l": 3, "t": "FHIR", "s": "fhir"}, {"l": 3, "t": "Recommendation to take the patient into care", "s": "recommendation-to-take-the-patient-into-care"}, {"l": 3, "t": "UCUM", "s": "ucum"}, {"l": 3, "t": "Elements with no value set bound", "s": "elements-with-no-value-set-bound"}], "title": "Terminology considerations", "file": "terminology-considerations.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Členění je podle číselníku, stejně jako v img-order a jako na odpovídající stránce publikovaného HL7 Czech Imaging Report IG: Snomed-CT, MKN-10 / Orphacode, NČLPPOL, číselníky zdravotních pojišťoven, LOINC, FHIR, doporučení převzetí do péče a UCUM. Sloupce jsou Kód položky, Popis položky, Hodnota.", "Každý prvek je uveden právě jednou. Liší-li se obor hodnot mezi typy K a FT, je to uvedeno u prvku, ne zdvojením řádku.", "Obory hodnot ověřeny proti publikovanému terminologickému IG 0.3.0 a proti profilům v repozitáři: cz-coverage-type u A.1.4.1 a A.2.4.1, condition-cz a mkn-10 u indikační diagnózy, administrative-gender-cz u pohlaví, contactrole-cz u typu kontaktu, document-category u kategorie dokumentu.", "Typ žádanky, Composition.type, je uveden s národním oborem hodnot referralorder-types a s kódy 57133-1 pro typ K a 57154-7 pro typ FT. V logickém modelu pro něj prvek A.x není, proto je uveden bez čísla. Totéž platí pro doporučení převzetí do péče, které nese rozšíření profilu.", "Uvedeno, že code systémy korder-vzp-procedures-cs a ft-vzp-procedures-cs jsou označeny jako fragment a obsahují jen demonstrační podmnožinu kódů použitou v příkladech, takže závazným zdrojem je balík číselníků pojišťovny.", "U omezení pohyblivosti jsou uvedeny oba obory hodnot, cz-mobility-type se čtyřmi kódy typu hodnoceného úkonu a cz-mobility-value s osmi kódy hodnocení.", "Poslední oddíl vyjmenovává kódované prvky, u kterých příručka obor hodnot dosud nenavazuje: odbornost objednatele, alergie a intolerance, lateralita u typu FT a kódované prvky informací o vzorku.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|model-map": {"body": "<p>This page lists the pages documenting with a graphical representation the maps between the Logical Models and the used resources/profiles.</p>\n<p><strong>Consultation order, type K</strong></p>\n<table class=\"grid\">\n<thead><tr><th>Section of the logical model</th><th>Logical model</th><th>Map</th></tr></thead><tbody>\n<tr><td><code>A.1</code> Document header</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Header</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">K-Header-map</span></td></tr>\n<tr><td><code>A.2</code> and <code>A.3</code> Document body</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Body of the K-order</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">K-Body-map</span></td></tr>\n</tbody></table>\n<p><strong>Physiotherapy order, type FT</strong></p>\n<table class=\"grid\">\n<thead><tr><th>Section of the logical model</th><th>Logical model</th><th>Map</th></tr></thead><tbody>\n<tr><td><code>A.1</code> Document header</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Header</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">FT-Header-map</span></td></tr>\n<tr><td><code>A.2</code> and <code>A.3</code> Document body</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Body of the FT-order</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">FT-Body-map</span></td></tr>\n</tbody></table>\n<p><strong>Common to both types</strong></p>\n<table class=\"grid\">\n<thead><tr><th>Section of the logical model</th><th>Logical model</th><th>Map</th></tr></thead><tbody>\n<tr><td><code>A.4</code> Presented form</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Presented form</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Attatchmant-map</span></td></tr>\n<tr><td><code>A.5</code> Attachments</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Attachments</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Attatchmant-map</span></td></tr>\n</tbody></table>", "num": 8, "toc": [], "title": "Mapping to profiles", "file": "model-map.md", "changes": ["Doplněn sloupec se sekcí logického modelu a odkazy na samotné logické modely, dosud stránka odkazovala jen na mapovací stránky.", "Doplněny sekce A.4 a A.5 s odkazem na stránku Attatchmant-map. Ta v repozitáři existuje, ale neodkazovala na ni žádná stránka a nebyla uvedena v konfiguraci, takže se nepublikovala.", "Popisky odkazů sjednoceny s cíli. Původní tabulka měla u obou typů texty Header-map.html a Body-map.html bez ohledu na to, kam odkaz vede.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|examples": {"body": "<h4 id=\"examples-of-the-consultation-order\"><span class=\"secno\">9.1</span> Examples of the consultation order</h4>\n<p>Examples of instances are published in this guide. Funkční specifikace eŽádanky K states the same examples under the same names and in the same order, but without their content.</p>\n<table class=\"grid\">\n<thead><tr><th>Example</th><th>What it demonstrates</th><th>Instance</th></tr></thead><tbody>\n<tr><td>Cardiology consultation for exertional dyspnoea</td><td>A non-addressed eReferral with several requested services in one document, a consultation examination and an echocardiography, and with an additional recipient of the result. The general practitioner asks for an assessment of whether the worsening exertional dyspnoea is of cardiac origin.</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleKOrderExample</span></td></tr>\n<tr><td>Dermatology consultation for a suspect pigmented lesion</td><td>An addressed eReferral with increased urgency and with an image attachment that supplements the structured content. The general practitioner sends a patient with a rapidly changing pigmented lesion to a specific pigmented lesion clinic.</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleDermatologyUrgentExample</span></td></tr>\n<tr><td>Nephrology consultation on the progression of chronic kidney disease</td><td>An eReferral in the scenario of recommending that the patient be taken into care, that is not a one-off assessment. It carries the creatinine and eGFR values as supporting clinical information.</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleNephrologyHandoverExample</span></td></tr>\n</tbody></table>\n<h4 id=\"examples-of-the-physiotherapy-order\"><span class=\"secno\">9.2</span> Examples of the physiotherapy order</h4>\n<table class=\"grid\">\n<thead><tr><th>Example</th><th>What it demonstrates</th><th>Instance</th></tr></thead><tbody>\n<tr><td>Rehabilitation after total hip replacement</td><td>A non-addressed eReferral in a patient with reduced mobility and an implant. The eReferral carries the date of the operation, the permitted load on the operated limb, the type of the implant and the reduced mobility of the patient.</td><td>in preparation</td></tr>\n<tr><td>Respiratory physiotherapy in a patient with chronic obstructive pulmonary disease</td><td>A fully completed referral form with the number of procedures and with care at the patient's place of stay. The specific procedures are stated, ten procedures, twice a week, the therapy is performed at the patient's home.</td><td>in preparation</td></tr>\n<tr><td>Physiotherapy in a paediatric patient with faulty posture</td><td>A partially completed referral form where the scope of care is proposed by the physiotherapist. Only the diagnosis and the goal of the therapy are stated, neither the specific procedures nor their number are filled in. A legal representative is part of the eReferral.</td><td>in preparation</td></tr>\n</tbody></table>\n<p>The examples correspond to Table 7 of Funkční specifikace eŽádanky FT. Until they are delivered, the guide publishes the technical example <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleFTExample</span>, which shows the detailed model of prescription: one requested procedure corresponds to one requested service resource.</p>\n<p>All the examples can also be found on the <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Artifacts</span> page.</p>\n<h4 id=\"examples-of-profiles\"><span class=\"secno\">9.3</span> Examples of profiles</h4>\n<ul>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Composition of the consultation order</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Composition of the physiotherapy order</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Requested service – consultation examination</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Requested service – physiotherapy procedure</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Patient</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Practitioner</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Practitioner role</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Healthcare provider</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Subordinate department of a provider</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Health insurance company</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Coverage</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Indicating diagnosis</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Observation – creatinine</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Attachment – clinical photo documentation</span></li>\n</ul>", "num": 9, "toc": [{"l": 3, "t": "Examples of the consultation order", "s": "examples-of-the-consultation-order"}, {"l": 3, "t": "Examples of the physiotherapy order", "s": "examples-of-the-physiotherapy-order"}, {"l": 3, "t": "Examples of profiles", "s": "examples-of-profiles"}], "title": "Examples", "file": "examples.md", "changes": ["Stránka vznikla v commitu f50b405 z 3. 9. 2026, tento návrh na ni navazuje. Zachovává její obsah a doplňuje ho.", "Nadpisy sjednoceny na úroveň h3 jako na ostatních stránkách příručky. Původní verze používala h1 a h2, takže vedle titulku stránky generovaného publikátorem vznikal druhý nadpis první úrovně.", "Názvy příkladů typu K sjednoceny s Tabulkou 6 ve Funkční specifikaci eŽádanky K 6.2, aby byla vazba mezi FS a IG jednoznačná. Rozdíly jsou malé: FS nemá u dermatologického příkladu slovo „urgentní“ a nefrologický příklad nazývá „Nefrologické konzilium při progresi chronického onemocnění ledvin“.", "Doplněn sloupec Co demonstruje s textem z FS, takže klinické scénáře se nemusí v IG opisovat.", "U typu FT jsou uvedeny všechny tři příklady z Tabulky 7 ve Funkční specifikaci eŽádanky FT 7.0 se sloupcem Co demonstruje a se stavem „připravuje se“ ve sloupci Instance. Narovná se to, až budou instance dodány. Existující technický příklad BundleFTExample je zmíněn pod tabulkou.", "Doplněn výčet příkladů profilů s odkazy na instance.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|implementation-notes": {"body": "<p>This page contains notes for implementers of the consultation order and the physiotherapy order. They concern the assembly of the FHIR Bundle and the population of its profiles with data.</p>\n<h4 id=\"overview\"><span class=\"secno\">10.1</span> Overview</h4>\n<p>Both types of eReferral are represented as a FHIR Bundle of type <code>document</code> containing the composition of the given type and all resources in the tree of referenced resources, see <a href=\"https://www.hl7.org/fhir/composition-operation-document.html\" target=\"_blank\" rel=\"noopener\">$document operation</a>. One bundle always contains exactly one composition: <code>KOrderCompositionCz</code> for type K, <code>FTOrderCompositionCz</code> for type FT.</p>\n<pre class=\"code\">classDiagram\n  direction LR\n  class BundleOrderCz{\n    &lt;&lt;Bundle&gt;&gt;\n  }\n  BundleOrderCz *-- \"0..1\" KOrderCompositionCz\n  BundleOrderCz *-- \"0..1\" FTOrderCompositionCz\n  BundleOrderCz *-- \"1\" CZ_PatientCore\n  BundleOrderCz *-- \"1..*\" KOrderServiceRequestCz\n  BundleOrderCz *-- \"1..*\" FTServiceRequestCz\n  BundleOrderCz *-- \"1..*\" CZ_Coverage\n  BundleOrderCz *-- \"0..*\" CZ_ConditionCore\n  BundleOrderCz *-- \"0..*\" CZ_PractitionerCore\n  BundleOrderCz *-- \"0..*\" CZ_PractitionerRoleOrder\n  BundleOrderCz *-- \"0..*\" CZ_OrganizationCore\n  BundleOrderCz *-- \"0..*\" CZ_ObservationOrder\n  BundleOrderCz *-- \"0..*\" CZ_Attachment\n\n  KOrderCompositionCz --&gt; CZ_PatientCore: subject\n  KOrderCompositionCz --&gt; CZ_PractitionerRoleOrder: author\n  KOrderCompositionCz --&gt; CZ_OrganizationCore: custodian\n  KOrderCompositionCz --&gt; KOrderServiceRequestCz: section[orderInformation]\n  KOrderCompositionCz --&gt; CZ_Coverage: section[coverage]\n  KOrderCompositionCz --&gt; CZ_ConditionCore: section[significantMedicalHistory]\n  KOrderCompositionCz --&gt; CZ_ObservationOrder: section[supportingInformation]\n  KOrderCompositionCz --&gt; CZ_Attachment: section[attachments]\n\n  FTOrderCompositionCz --&gt; CZ_PatientCore: subject\n  FTOrderCompositionCz --&gt; CZ_PractitionerRoleOrder: author\n  FTOrderCompositionCz --&gt; FTServiceRequestCz: section[orderInformation]\n  FTOrderCompositionCz --&gt; CZ_Coverage: section[coverage]\n  FTOrderCompositionCz --&gt; CZ_Attachment: section[attachments]</pre>\n<p>The content of the individual sections and the meaning of the elements are stated on the <a href=\"#/k-order/scope-and-content#conceptual-view\">Scope and content</a> page and in the definitions of the logical models, see <a href=\"#/k-order/logical-models\">Logical models</a>. This page does not repeat them.</p>\n<h4 id=\"one-requested-procedure-one-requested-service-resource\"><span class=\"secno\">10.2</span> One requested procedure, one requested service resource</h4>\n<p>One requested procedure corresponds to one requested service resource, that is to one <code>ServiceRequest</code>, and all of them are referenced from the <code>section[orderInformation]</code> section. The cardinality <code>1..*</code> means that a single eReferral may carry several requested procedures — in type K for example a consultation examination and an echocardiography, in type FT the individual lines of the referral form.</p>\n<p>In type FT the number and the frequency of performance are a property of the particular requested procedure, not of the document as a whole. They are therefore carried by the requested service resource, not by the composition.</p>\n<h4 id=\"composition-sections-in-type-k\"><span class=\"secno\">10.3</span> Composition sections in type K</h4>\n<p>The elements <code>A.3.2.2</code> to <code>A.3.2.6</code> of the consultation order are carried by separate sections of the composition. The following table states their binding, because it is not apparent from the name of the section.</p>\n<table class=\"grid\">\n<thead><tr><th>Element</th><th>Composition section</th><th>Section code</th><th>What the section is populated with</th></tr></thead><tbody>\n<tr><td><code>A.3.2.2</code> Significant medical history</td><td><code>section[significantMedicalHistory]</code></td><td>LOINC <code>11348-0</code></td><td>references to conditions</td></tr>\n<tr><td><code>A.3.2.3</code> Examination results</td><td><code>section[examinationResults]</code></td><td>LOINC <code>30954-2</code></td><td>references to diagnostic reports</td></tr>\n<tr><td><code>A.3.2.4</code> Differential diagnosis</td><td><code>section[differentialDiagnosis]</code></td><td>LOINC <code>51848-0</code></td><td>references to conditions</td></tr>\n<tr><td><code>A.3.2.5</code> Current treatment, medication including dosage</td><td><code>section[currentTreatment]</code></td><td>LOINC <code>11506-3</code></td><td>references to medication statements</td></tr>\n<tr><td><code>A.3.2.6</code> Referenced documentation</td><td><code>section[referencedDocumentation]</code></td><td>LOINC <code>77599-9</code></td><td>references to documents</td></tr>\n</tbody></table>\n<p>In type FT the element <code>A.3.2.2 Goal of the examination</code> is carried by the <code>section[goals]</code> section with the LOINC code <code>61146-7</code>. The clinical justification, that is the condition requiring therapy, the goal and the risks, is carried in type FT by the <code>section[reasons]</code> section as text, because it is common to the whole referral form.</p>\n<p>Where no data are available for a required section, the reason is expressed in <code>composition.section.emptyReason</code>.</p>\n<h4 id=\"consequences-of-immutability-for-assembling-the-bundle\"><span class=\"secno\">10.4</span> Consequences of immutability for assembling the bundle</h4>\n<p>The bundle is assembled and signed at issue and does not change afterwards, see <a href=\"#/k-order/workflow\">Workflow</a>. Immutability is a property of the document, but which data change during processing is determined by the system through which the document is exchanged. The two consequences below therefore apply in the context of the eReferral system, that is the Czech implementation.</p>\n<ol>\n<li><strong>Data that change during processing do not belong in the bundle.</strong> If a recommended provider was stated in the element <code>A.1.6 Requested performer</code> and the care is eventually provided by another one, the original provider remains in the document. The same applies to the distribution of the result with respect to the element <code>A.1.7 Additional recipient</code>.</li>\n<li><strong>Content is not supplemented by issuing a new version of the document.</strong> The element <code>A.2.5 Appointment</code> carries the date requested or agreed at the time of issue, not the date for which the patient was booked later. In type FT this also holds for the therapeutic plan composed by the therapist in the model with a delegated scope: the therapist records it in their own medical records, not in the eReferral.</li>\n</ol>\n<h4 id=\"identifiers\"><span class=\"secno\">10.5</span> Identifiers</h4>\n<p>Three different identifiers appear in and around the document and must be distinguished.</p>\n<table class=\"grid\">\n<thead><tr><th>Identifier</th><th>Where it is</th><th>What it is for</th></tr></thead><tbody>\n<tr><td><code>A.2.1.1</code> Order identifier</td><td>in the document, an element of the logical model</td><td>Identifies the order in the requester's system. It is assigned by the sending system when the document is assembled.</td></tr>\n<tr><td>System identifier of the eReferral (<code>id</code>, UUID)</td><td>outside the document, assigned by the eReferral system on storage</td><td>Uniquely identifies the eReferral in the whole ecosystem. Subsequent clinical documents use it to reference the original eReferral.</td></tr>\n<tr><td>Code of the eReferral (eight alphanumeric characters)</td><td>outside the document, assigned by the eReferral system on storage</td><td>It is communicated to the patient and serves to present the eReferral to the provider of the requested care.</td></tr>\n</tbody></table>\n<p>Neither the system identifier nor the code is part of the FHIR Bundle, because they do not yet exist at the moment the bundle is assembled and signed.</p>\n<h4 id=\"signature-of-the-document\"><span class=\"secno\">10.6</span> Signature of the document</h4>\n<p>The element <code>A.1.9 Electronic signatures</code> carries the electronic signature or seal of the document and the time stamp. The person who wrote the order and the person who signed it are identified in the document by the non-semantic identifier of a healthcare practitioner, and they need not be the same person.</p>\n<p>Neither the signing method nor its verification is described in this guide. It follows the general methodology for signing FHIR documents.</p>\n<h4 id=\"acceptance-with-generalisation-of-the-requested-care\"><span class=\"secno\">10.7</span> Acceptance with generalisation of the requested care</h4>\n<p>The concepts in the <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-procedures-vs</span> and <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-order-procedures-vs</span> value sets are arranged hierarchically, so it can be derived that a requested concept is subsumed by a concept the performing workplace works with, and the request can be accepted. The original coded information and its textual form must remain visible to the performer. The requester's information system must support the whole value set of the requested care, offering only a subset at data entry is acceptable.</p>\n<p>Where the requested care is expressed by a procedure of a health insurance company, generalisation in this way cannot be performed, because those code systems have no hierarchy of concepts.</p>", "num": 10, "toc": [{"l": 3, "t": "Overview", "s": "overview"}, {"l": 3, "t": "One requested procedure, one requested service resource", "s": "one-requested-procedure-one-requested-service-resource"}, {"l": 3, "t": "Composition sections in type K", "s": "composition-sections-in-type-k"}, {"l": 3, "t": "Consequences of immutability for assembling the bundle", "s": "consequences-of-immutability-for-assembling-the-bundle"}, {"l": 3, "t": "Identifiers", "s": "identifiers"}, {"l": 3, "t": "Signature of the document", "s": "signature-of-the-document"}, {"l": 3, "t": "Acceptance with generalisation of the requested care", "s": "acceptance-with-generalisation-of-the-requested-care"}], "title": "Implementation notes", "file": "implementation-notes.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Osnova je stejná jako u img-order: Přehled s diagramem bundlu, Důsledky neměnnosti, Identifikátory, Podpis dokumentu a Přijetí se zobecněním.", "V Přehledu je uvedeno, že v jednom bundlu je vždy právě jedna kompozice, u typu K KOrderCompositionCz a u typu FT FTOrderCompositionCz.", "Nové: oddíl Jeden požadovaný výkon, jeden zdroj požadované služby. U typu FT nese počet a frekvenci provedení zdroj požadované služby, ne kompozice.", "Nové: tabulka vazby prvků A.3.2.2 až A.3.2.6 na sekce kompozice u typu K, včetně kódů LOINC a toho, čím je která sekce naplněna. Z názvů sekcí ta vazba není zřejmá.", "Doplněno, že u typu FT nese prvek A.3.2.2 Cíl vyšetření sekce goals a že klinické odůvodnění nese sekce reasons textem, protože je pro celý poukaz společné.", "Oddíl Důsledky neměnnosti je výslovně omezen na kontext systému eŽádanka, tedy na českou implementaci. U typu FT je doplněno, že totéž platí pro terapeutický plán sestavený terapeutem.", "Doplněno, že u výkonů zdravotních pojišťoven nelze přijetí se zobecněním provést, protože tyto číselníky nemají hierarchii konceptů.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}}, "menu": [["Home", ["index"]], ["Introduction", ["scope-and-content", "background"]], ["Functional", ["use-cases", "workflow", "logical-models", "terminology-considerations"]], ["Implementation", ["model-map", "examples", "implementation-notes"]]], "titles": {"cs": {"index": "Domovská stránka", "scope-and-content": "Rozsah použití a obsah", "background": "Background", "use-cases": "Případy užití", "workflow": "Workflow", "logical-models": "Logické modely", "terminology-considerations": "Terminologické aspekty", "model-map": "Mapování logického modelu", "examples": "Příklady", "implementation-notes": "Poznámky k implementaci"}, "en": {"index": "Home", "scope-and-content": "Scope and content", "background": "Background", "use-cases": "Use cases", "workflow": "Workflow", "logical-models": "Logical models", "terminology-considerations": "Terminology considerations", "model-map": "Mapping to profiles", "examples": "Examples", "implementation-notes": "Implementation notes"}}, "igs": {"k-order": {"label": "k-order", "full": "HL7 Czech Order Implementation Guide", "sub": "typy K a FT — konziliární žádanka a žádanka o fyzioterapii", "ver": "0.0.3"}}, "order": ["index", "scope-and-content", "background", "use-cases", "workflow", "logical-models", "terminology-considerations", "model-map", "examples", "implementation-notes"], "removed": {}, "intro": "Náhled navrhované narativní části obou implementačních příruček eŽádanek. Není to publikace ani sestavený IG — vzhled napodobuje strukturu IG jen pro orientaci. Zelený rámeček na každé stránce uvádí, co se proti dnešnímu sta

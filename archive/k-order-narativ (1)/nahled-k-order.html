<script>
const D = {"pages": {"k-order|cs|index": {"body": "<h4 id=\"uvod\"><span class=\"secno\">1.1</span> Úvod</h4>\n<p>Tato implementační příručka je založena na <a href=\"https://hl7.org/fhir/R4/\" target=\"_blank\" rel=\"noopener\">FHIR version R4</a> a definuje společnou bázi pro elektronické požadavkové dokumenty, tedy eŽádanky, v českém národním kontextu. Je zpracována v souladu s evropskými směrnicemi eHN a koncepty Xt-EHR.</p>\n<p>Nad touto společnou bází příručka definuje <strong>dva typy eŽádanky</strong>:</p>\n<ul>\n<li><strong>Konziliární žádanku, typ K</strong>, kterou žádající lékař vyžaduje odborný názor specialisty, vyšetření nebo ošetření specialistou, případně doporučuje převzetí pacienta do ambulantní či ústavní péče,</li>\n<li><strong>Žádanku o fyzioterapii, typ FT</strong>, kterou ošetřující lékař vyžaduje fyzioterapii nebo ergoterapii.</li>\n</ul>\n<p>Oba typy jsou součástí zdravotnické dokumentace pacienta a autorizují vyžádanou zdravotní službu, takže tam, kde je péče hrazena z veřejného zdravotního pojištění, jsou předpokladem její úhrady. Zákonné vymezení eŽádanky a předpisy určující její obsah uvádí kapitola Reference.</p>\n<p>Příručka vymezuje obsahové komponenty dokumentu a strukturu, ve které se sestavuje: logický model, jeho mapování na FHIR profily a resources, strukturu FHIR Bundle, obory hodnot a příklady instancí. Cílem je, aby byla eŽádanka elektronicky vyměnitelná mezi poskytovateli zdravotních služeb, jejich informačními systémy a národní infrastrukturou elektronického zdravotnictví.</p>\n<p>Do budoucna se předpokládá rozšíření společné báze o další typy požadavkových dokumentů, například o laboratorní žádanku.</p>\n<h5 id=\"spolecna-kostra-a-typove-odlisnosti\"><span class=\"secno\">1.1.1</span> Společná kostra a typové odlišnosti</h5>\n<p>Oba typy vycházejí z jednotné kostry logického modelu. Sdílí hlavičku dokumentu <code>A.1</code>, tělo dokumentu <code>A.2</code>, prezentovanou formu <code>A.4</code> a přílohy <code>A.5</code> a <strong>liší se pouze v sekci <code>A.3</code></strong>, konkrétně v prvku <code>A.3.2 Datové elementy objednávky</code>, který nese vymezení požadované péče vlastní danému typu.</p>\n<p>Kostra i číslování prvků jsou společné všem typům eŽádanky, tedy i těm, které jsou publikovány v jiných implementačních příručkách. Prvek <code>A.1.7</code> proto označuje tentýž údaj bez ohledu na typ.</p>\n<h5 id=\"dve-casti-ezadanky\"><span class=\"secno\">1.1.2</span> Dvě části eŽádanky</h5>\n<p>Z pohledu rozhraní se eŽádanka skládá ze dvou částí.</p>\n<table class=\"grid\">\n<thead><tr><th>Část</th><th>Co nese</th><th>Kde je popsána</th></tr></thead><tbody>\n<tr><td>Systémová hlavička</td><td>Typ žádanky, žadatele, pacienta, adresáta, dodatečné příjemce výsledku a odkaz na nadřízenou žádanku. Nenese klinický obsah a v průběhu životního cyklu se může měnit.</td><td>Standard systému eŽádanka, schéma v OpenAPI specifikaci</td></tr>\n<tr><td>FHIR Bundle typu <code>document</code></td><td>Veškerý klinický obsah dokumentu. Je sestaven a podepsán při vystavení a po celý životní cyklus eŽádanky se nemění.</td><td><strong>Tato příručka</strong>, Obecná funkční specifikace dokumentu eŽádanka a Speciální funkční specifikace příslušného typu</td></tr>\n</tbody></table>\n<p><strong>Tato příručka popisuje pouze FHIR Bundle.</strong> Systémovou hlavičku nepopisuje.</p>\n<p>Tato příručka nepopisuje způsob výměny dokumentu.</p>\n<h5 id=\"vztah-k-ostatni-dokumentaci\"><span class=\"secno\">1.1.3</span> Vztah k ostatní dokumentaci</h5>\n<p>Dokumentace eŽádanek je členěna do níže uvedené sady.</p>\n<table class=\"grid\">\n<thead><tr><th>Dokument</th><th>Co popisuje</th></tr></thead><tbody>\n<tr><td>Standard „Systém eŽádanka“</td><td>Systém eŽádanky jako celek: aktéři, role a oprávnění, architektura, stavový model a životní cyklus, procesy a operace rozhraní, integrace, kybernetická bezpečnost a provozní podmínky.</td></tr>\n<tr><td>Obecná funkční specifikace dokumentu eŽádanka</td><td>Obsah a vlastnosti dokumentu eŽádanka společné všem typům.</td></tr>\n<tr><td>Speciální funkční specifikace eŽádanky typu K</td><td>Specifika typu K: klinické scénáře, typové požadavky na obsah, mapovací tabulka na datové rozhraní a typové obory hodnot.</td></tr>\n<tr><td>Speciální funkční specifikace eŽádanky typu FT</td><td>Totéž pro typ FT, včetně pravidel obou modelů preskripce.</td></tr>\n<tr><td>Implementační specifikace (tato příručka pro typy K a FT)</td><td>Kompletní logický model, mapování na FHIR resources a profily, struktura FHIR Bundle, obory hodnot a jejich code systémy, příklady instancí.</td></tr>\n<tr><td>OpenAPI specifikace rozhraní</td><td>Datová schémata rozhraní: pole, datové typy, kardinality, příklady a chybové odpovědi.</td></tr>\n</tbody></table>\n<p>Každý typ eŽádanky má vlastní speciální funkční specifikaci. Tam, kde tato příručka odkazuje na Speciální funkční specifikaci příslušného typu, jde tedy u typu K o <em>Funkční specifikaci eŽádanky K</em> a u typu FT o <em>Funkční specifikaci eŽádanky FT</em>.</p>\n<h4 id=\"strucny-rozsah\"><span class=\"secno\">1.2</span> Stručný rozsah</h4>\n<p>Tato příručka je rozdělena na několik stránek, které jsou uvedeny v horní části každé stránky na liště nabídek.</p>\n<ul>\n<li><a href=\"#/k-order/index-cs\">Home - Domovská stránka</a>: Tato stránka poskytuje úvodní informace, vztah k ostatní dokumentaci, stručný rozsah použití, reference, závislosti, rozdílovou analýzu verzí a prohlášení o duševním vlastnictví.</li>\n<li>Introduction:</li>\n<ul>\n<li><a href=\"#/k-order/scope-and-content-cs\">Rozsah použití a obsah</a>: Tento segment vymezuje, co příručka pokrývá a co ne, a uvádí kostru logického modelu dokumentu.</li>\n<li><a href=\"#/k-order/background-cs\">Background</a>: Tento segment obsahuje informace o původu definice konziliární žádanky a žádanky o fyzioterapii.</li>\n</ul>\n<li>Functional:</li>\n<ul>\n<li><a href=\"#/k-order/use-cases-cs\">Případy užití</a>: Tento segment odkazuje na klinické scénáře a na instance, které je realizují.</li>\n<li><a href=\"#/k-order/workflow-cs\">Workflow</a>: Tento segment vymezuje, co je a co není stavem eŽádanky.</li>\n<li><a href=\"#/k-order/logical-models-cs\">Logické modely</a>: Tento segment obsahuje seznam logických modelů s čísly a názvy prvků.</li>\n<li><a href=\"#/k-order/terminology-considerations-cs\">Terminologické aspekty</a>: Tento segment obsahuje informace o použitých code systémech a oborech hodnot.</li>\n</ul>\n<li>Implementation:</li>\n<ul>\n<li><a href=\"#/k-order/model-map-cs\">Mapování logického modelu</a>: Tento segment obsahuje mapování logického modelu na profily.</li>\n<li><a href=\"#/k-order/examples-cs\">Příklady</a>: Tento segment obsahuje příklady instancí.</li>\n<li><a href=\"#/k-order/implementation-notes-cs\">Poznámky k implementaci</a>: Tento segment obsahuje informace pro implementaci.</li>\n</ul>\n<li>About:</li>\n<ul>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Záznam změn</span>: Tento segment obsahuje přehled změn v jednotlivých verzích příručky.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Autoři</span>: Tento segment obsahuje informace o autorech.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Downloads</span>: Tento segment obsahuje informace o možnostech stahování obsahu implementační specifikace.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Závislosti</span>: Tento segment obsahuje informace o závislostech.</li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Autorská práva</span>: Tento segment obsahuje informace o autorských právech.</li>\n</ul>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Artifacts</span>: Tato stránka poskytuje seznam FHIR artefaktů definovaných jako součást této implementační příručky.</li>\n</ul>\n<h4 id=\"reference\"><span class=\"secno\">1.3</span> Reference</h4>\n<p>Papírovými vzory jsou <strong>Poukaz na vyšetření/ošetření typu K</strong> a <strong>Poukaz na fyzioterapii/ergoterapii typu FT</strong>. Požadavky na obsah vyžádání dalších zdravotních služeb stanoví <code>příloha č. 1 v části 2 k vyhlášce č. 444/2024 Sb., o zdravotnické dokumentaci</code>, ve znění k 19. 2. 2025.</p>\n<ul>\n<li>Související specifikace:</li>\n<ul>\n<li><a href=\"https://hl7.cz/fhir/img-order/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Imaging Order FHIR IG</a></li>\n<ul>\n<li>Sesterská příručka téže sady dokumentace. Sdílí s touto příručkou kostru logického modelu a číslování prvků.</li>\n</ul>\n<li><a href=\"http://build.fhir.org/ig/Xt-EHR/xt-ehr-common/index.html\" target=\"_blank\" rel=\"noopener\">EHDS Logical Information Models</a></li>\n<ul>\n<li>Tato specifikace inspirovala mnoho návrhových vzorů definovaných v tomto IG.</li>\n</ul>\n<li><a href=\"http://build.fhir.org/ig/HL7-cz/lab-order/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Laboratory Order IG</a></li>\n<ul>\n<li>Tato specifikace sdílí společné návrhové principy pro elektronické žádanky.</li>\n</ul>\n<li><a href=\"http://build.fhir.org/ig/HL7-cz/img/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Imaging Report IG</a></li>\n<ul>\n<li>Tato specifikace sdílí společné návrhové principy pro elektronické žádanky.</li>\n</ul>\n<li><a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a></li>\n<ul>\n<li>Kde to bylo možné, byly poděděny specifikace z definic CZ Core.</li>\n</ul>\n</ul>\n</ul>\n<h4 id=\"zavislosti\"><span class=\"secno\">1.4</span> Závislosti</h4>\n<div class=\"gen\">Zde publikátor IG vygeneruje blok <code>dependency-table.xhtml</code>.</div>\n<h4 id=\"rozdilova-analyza-verzi\"><span class=\"secno\">1.5</span> Rozdílová analýza verzí</h4>\n<div class=\"gen\">Zde publikátor IG vygeneruje blok <code>cross-version-analysis.xhtml</code>.</div>\n<h4 id=\"prohlaseni-o-dusevnim-vlastnictvi\"><span class=\"secno\">1.6</span> Prohlášení o duševním vlastnictví</h4>\n<div class=\"gen\">Zde publikátor IG vygeneruje blok <code>ip-statements.xhtml</code>.</div>", "num": 1, "toc": [{"l": 3, "t": "Úvod", "s": "uvod"}, {"l": 4, "t": "Společná kostra a typové odlišnosti", "s": "spolecna-kostra-a-typove-odlisnosti"}, {"l": 4, "t": "Dvě části eŽádanky", "s": "dve-casti-ezadanky"}, {"l": 4, "t": "Vztah k ostatní dokumentaci", "s": "vztah-k-ostatni-dokumentaci"}, {"l": 3, "t": "Stručný rozsah", "s": "strucny-rozsah"}, {"l": 3, "t": "Reference", "s": "reference"}, {"l": 3, "t": "Závislosti", "s": "zavislosti"}, {"l": 3, "t": "Rozdílová analýza verzí", "s": "rozdilova-analyza-verzi"}, {"l": 3, "t": "Prohlášení o duševním vlastnictví", "s": "prohlaseni-o-dusevnim-vlastnictvi"}], "title": "Domovská stránka", "file": "index-cs.md", "changes": ["Nový Úvod: příručka je implementační specifikací dvou typů eŽádanky, K a FT. Zachována původní teze o společné bázi požadavkových dokumentů i o budoucím rozšíření o další typy. Doplněno zákonné vymezení eŽádanky s odkazem na Reference.", "Nové: pododdíl Společná kostra a typové odlišnosti — sdílené sekce A.1, A.2, A.4 a A.5 a typový prvek A.3.2. Uvádí, že kostra i číslování prvků jsou společné všem typům eŽádanky, tedy i těm z jiných příruček, ale konkrétní jiný typ nejmenuje.", "Nové: pododdíl Dvě části eŽádanky — systémová hlavička a FHIR Bundle, s větou, že příručka popisuje pouze bundle.", "Nové: pododdíl Vztah k ostatní dokumentaci s tabulkou šesti dokumentů. Speciální funkční specifikace jsou uvedeny jako dvě samostatné, Funkční specifikace eŽádanky K a Funkční specifikace eŽádanky FT, a je výslovně řečeno, že odkaz na Speciální funkční specifikaci příslušného typu znamená u typu K jednu a u typu FT druhou.", "Zachován původní nadpis Stručný rozsah. Rozpis stránek doplněn o pět nových stránek a o oddíl About podle konfigurace příručky.", "Reference: doplněny oba papírové vzory, Poukaz typu K i Poukaz typu FT, a vyhláška č. 444/2024 Sb. Originál uváděl jen obecnou větu o příslušných typech zdravotnických formulářů.", "Vypuštěna věta o hlavním cíli příručky a o zajištění jednotného přístupu k reprezentaci. Co příručka definuje, je nově řečeno věcně v jednom odstavci.", "Vypuštěny zmínky o typu Z. Sesterská příručka je v Referencích uvedena jako příručka téže sady dokumentace, se kterou se sdílí kostra modelu a číslování prvků, bez uvádění typu, který pokrývá. Dosud se obě příručky navzájem neodkazovaly vůbec.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|scope-and-content": {"body": "<h4 id=\"oblasti-reseni\"><span class=\"secno\">2.1</span> Oblasti řešení</h4>\n<h5 id=\"zahrnute-oblasti\"><span class=\"secno\">2.1.1</span> Zahrnuté oblasti</h5>\n<p>Tato příručka pokrývá <strong>eŽádanku typu K, Konziliární žádanku</strong>, a <strong>eŽádanku typu FT, Žádanku o fyzioterapii</strong>. Oba typy sdílí kostru logického modelu i číslování prvků a liší se pouze v prvku <code>A.3.2 Datové elementy objednávky</code>.</p>\n<p><strong>Konziliární žádankou</strong> se rozumí žádanka, jejímž předmětem je odborné posouzení nebo výkon v kompetenci specialisty a jejímž výsledkem je klinický dokument, typicky konziliární nebo ambulantní zpráva.</p>\n<p><strong>Žádankou o fyzioterapii</strong> se rozumí žádanka na fyzioterapii nebo ergoterapii u pacienta s poruchou funkce, kterou lze terapií ovlivnit. Vlastní tomuto typu je volba mezi dvěma modely preskripce: ošetřující lékař buď sám vypíše konkrétní požadované výkony, jejich počet a frekvenci, nebo určí pouze kategorii požadované péče, tedy fyzioterapii nebo ergoterapii, a sestavení terapeutického plánu deleguje na terapeuta se specializovanou způsobilostí. Obsahová pravidla obou modelů uvádí Speciální funkční specifikace eŽádanky typu FT.</p>\n<p>U obou typů lze na jedné eŽádance požadovat více služeb současně, protože prvek <code>A.3.2.1 Požadované vyšetření</code> má kardinalitu <code>1..*</code>. Obory hodnot, kterými se požadovaná péče vyjadřuje, uvádí stránka <a href=\"#/k-order/terminology-considerations-cs\">Terminologické aspekty</a>.</p>\n<h5 id=\"nezahrnute-oblasti\"><span class=\"secno\">2.1.2</span> Nezahrnuté oblasti</h5>\n<p>Tato příručka neřeší celkový ekosystém eŽádanek ani způsob jejich přenosu. Dále nepokrývá:</p>\n<ul>\n<li><strong>ostatní typy eŽádanky</strong> — mají vlastní implementační příručky, viz <a href=\"https://hl7.cz/fhir/img-order/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Imaging Order FHIR IG</a>,</li>\n<li><strong>chování systému eŽádanky</strong> — stavy a jejich přechody, operace rozhraní, oprávnění, notifikace a provozní podmínky popisuje Standard systému eŽádanka,</li>\n<li><strong>systémovou hlavičku eŽádanky</strong> — tato příručka popisuje pouze FHIR Bundle, viz <a href=\"#/k-order/index-cs\">Domovská stránka</a>,</li>\n<li><strong>klinické scénáře a typové požadavky na obsah</strong> — jsou ve Speciální funkční specifikaci příslušného typu, tedy ve Funkční specifikaci eŽádanky K a ve Funkční specifikaci eŽádanky FT,</li>\n<li><strong>vykazování a úhradu vyžádané péče</strong> — mapování na datové rozhraní zdravotních pojišťoven je ve Speciální funkční specifikaci příslušného typu,</li>\n<li><strong>terapeutický plán sestavený terapeutem</strong> — u modelu s delegovaným rozsahem jej terapeut zaznamenává do vlastní zdravotnické dokumentace, nikoli do eŽádanky.</li>\n</ul>\n<h4 id=\"obsah\"><span class=\"secno\">2.2</span> Obsah</h4>\n<h5 id=\"informacni-modely\"><span class=\"secno\">2.2.1</span> Informační modely</h5>\n<h6 id=\"koncepcni-pohled\"><span class=\"secno\">2.2.1.1</span> Koncepční pohled</h6>\n<p>Kostra logického modelu je pro všechny typy eŽádanek jednotná a číslují se v ní stejná čísla prvků. Číslo prvku, například <code>A.1.7</code>, označuje tentýž údaj bez ohledu na typ eŽádanky a bez ohledu na to, ve které implementační příručce je definován. Na položky logického modelu se proto odkazuje <strong>číslem a názvem prvku</strong>, nikoli názvem modelu.</p>\n<table class=\"grid\">\n<thead><tr><th>Číslo</th><th>Sekce</th><th>Co obsahuje</th><th>Kdo ji definuje</th></tr></thead><tbody>\n<tr><td><code>A.1</code></td><td>Hlavička dokumentu</td><td>Administrativní údaje.</td><td>společná pro všechny typy</td></tr>\n<tr><td><code>A.2</code></td><td>Tělo dokumentu</td><td>Informace o objednávce a její odůvodnění, klinická událost, úhrada, termín návštěvy a informace o vzorku.</td><td>společná pro všechny typy</td></tr>\n<tr><td><code>A.3</code></td><td>Podpůrné informace a datové elementy</td><td>Podpůrné klinické informace a vymezení požadované péče. Prvek <code>A.3.2</code> je typový.</td><td>částečně společná, <code>A.3.2</code> odlišné pro K a pro FT</td></tr>\n<tr><td><code>A.4</code></td><td>Prezentovaná forma</td><td>Lidsky čitelná podoba dokumentu.</td><td>společná pro všechny typy</td></tr>\n<tr><td><code>A.5</code></td><td>Přílohy</td><td>Přílohy připojené k eŽádance.</td><td>společná pro všechny typy</td></tr>\n</tbody></table>\n<p>Příručka definuje kostru jako samostatný model <strong>Obecná žádanka</strong> a nad ním dva typové modely, <strong>K-žádanka</strong> a <strong>FT-žádanka</strong>. Ty se od sebe liší pouze modelem použitým pro tělo dokumentu.</p>\n<h6 id=\"skladba-zadanky\"><span class=\"secno\">2.2.1.1.1</span> Skladba žádanky</h6>\n<div class=\"diag\"><div class=\"diag-h\">Diagram <code>orderDiagram-cz.plantuml</code> — struktura</div>\n<ul>\n<li class=\"leaf\">Žádanka</li>\n<ul>\n<li class=\"node\">Hlavička žádanky</li>\n<li class=\"node\">Tělo žádanky</li>\n<li class=\"node\">Vizuální podoba dokumentu</li>\n<li class=\"node\">Přílohy</li>\n</ul>\n</ul>\n</div>\n<h6 id=\"hlavicka-zadanky\"><span class=\"secno\">2.2.1.1.2</span> Hlavička žádanky</h6>\n<div class=\"diag\"><div class=\"diag-h\">Diagram <code>orderHeaderDiagram.plantuml</code> — struktura</div>\n<ul>\n<li class=\"node\">Hlavička obrazové žádanky</li>\n<ul>\n<li class=\"node\">Identifikace pacienta</li>\n<li class=\"node\">Zdravotní pojištění</li>\n<li class=\"node\">Úhrada</li>\n<li class=\"node\">Metadata dokumentu</li>\n<ul>\n<li class=\"leaf\">ID dokumentu</li>\n<li class=\"leaf\">Kategorie dokumentu</li>\n<li class=\"leaf\">Stav žádanky</li>\n<li class=\"leaf\">Datum a čas vytvoření</li>\n<li class=\"leaf\">Název dokumentu</li>\n<li class=\"leaf\">Správce dokumentu</li>\n<li class=\"leaf\">Důvěrnost dokumentu</li>\n<li class=\"leaf\">Jazyk dokumentu</li>\n<li class=\"leaf\">Verze dokumentu</li>\n</ul>\n<li class=\"node\">Objednatel</li>\n<li class=\"node\">Provádějící</li>\n<li class=\"node\">Příjemce nálezu</li>\n<li class=\"node\">Elektronické podpisy</li>\n<ul>\n<li class=\"leaf\">Elektronický podpis nebo pečeť dokumentu</li>\n<li class=\"leaf\">Časové razítko</li>\n</ul>\n</ul>\n</ul>\n</div>\n<h6 id=\"telo-zadanky\"><span class=\"secno\">2.2.1.1.3</span> Tělo žádanky</h6>\n<div class=\"diag\"><div class=\"diag-h\">Diagram <code>orderBodyDiagram.plantuml</code> — struktura</div>\n<ul>\n<li class=\"node\">Tělo Obecné žádanky</li>\n<ul>\n<li class=\"node\">Informace o žádance</li>\n<li class=\"node\">Klinická událost</li>\n<li class=\"node\">Úhrada</li>\n<li class=\"node\">Termín vyšetření</li>\n<li class=\"node\">Informace o vzorku</li>\n<li class=\"node\">Klinické informace</li>\n<ul>\n<li class=\"leaf\">Biometrické údaje</li>\n<li class=\"leaf\">Váha</li>\n<li class=\"leaf\">Výška</li>\n<li class=\"leaf\">Urgentní informace</li>\n<ul>\n<li class=\"leaf\">Alergie a intolerance</li>\n<li class=\"leaf\">Varování</li>\n</ul>\n<li class=\"leaf\">Medikace</li>\n<li class=\"leaf\">Implantáty</li>\n<li class=\"leaf\">Omezení pohyblivosti pacienta</li>\n<li class=\"leaf\">Další relevantní klinické informace</li>\n<li class=\"leaf\">Očkování</li>\n<li class=\"leaf\">Datum hospitalizace</li>\n<li class=\"leaf\">Další formalizované údaje</li>\n</ul>\n<li class=\"node\">Datové elementy objednávky vyšetření</li>\n<ul>\n<li class=\"leaf\">Kod vyšetření</li>\n<li class=\"leaf\">Název vyšetření</li>\n<li class=\"leaf\">FT-Počet</li>\n<li class=\"leaf\">FT-Frekvence</li>\n<li class=\"leaf\">FT-Místo poskytnutí péče</li>\n<li class=\"leaf\">FT-Část těla</li>\n<li class=\"leaf\">FT-Lateralita</li>\n<li class=\"leaf\">Poznámka</li>\n<li class=\"leaf\">K-Závažná anamnestická data (text)</li>\n<li class=\"leaf\">K-Výsledky vyšetření (text)</li>\n<li class=\"leaf\">K-Diagnostická rozvaha (text)</li>\n<li class=\"leaf\">K-Současná léčba (text)</li>\n<li class=\"leaf\">K-Zapůjčená dokumentace (text)</li>\n</ul>\n<li class=\"node\">Odkazy na objednávky plánované péče navazující na tuto žádanku </li>\n<li class=\"node\">Ostatní podpůrné informace </li>\n</ul>\n</ul>\n</div>\n<h5 id=\"subjekty\"><span class=\"secno\">2.2.2</span> Subjekty</h5>\n<p>Pacient, zdravotnický pracovník a poskytovatel zdravotních služeb jsou definováni v <a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a> a tato příručka je pouze používá. Profil pacienta lokalizuje základní pojmy včetně identifikátorů a terminologie pro použití v českém kontextu, profil zdravotnického pracovníka umožňuje osobě přidělit roli, a profil poskytovatele vymezuje způsob reprezentace organizace včetně nadřízených a podřízených pracovišť.</p>\n<h5 id=\"objekty\"><span class=\"secno\">2.2.3</span> Objekty</h5>\n<p>Zdravotnický přístroj a zdravotnický prostředek jsou rovněž definovány v <a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a>. Totéž platí pro komponenty společné více dokumentům, například pro biometrické údaje, které jsou napříč dokumenty definovány shodně.</p>\n<h4 id=\"struktura-zadanky\"><span class=\"secno\">2.3</span> Struktura žádanky</h4>\n<p>Následující oddíly uvádějí prvky jednotlivých sekcí kostry. Úplný seznam prvků s jejich kardinalitami, datovými typy a obory hodnot je na stránce <a href=\"#/k-order/logical-models-cs\">Logické modely</a>, mapování na FHIR profily na stránce <a href=\"#/k-order/model-map-cs\">Mapování logického modelu</a>.</p>\n<h5 id=\"hlavicka-dokumentu\"><span class=\"secno\">2.3.1</span> Hlavička dokumentu</h5>\n<p>Hlavička je pro oba typy shodná.</p>\n<table class=\"grid\">\n<thead><tr><th>Číslo</th><th>Prvek</th><th>Co nese</th></tr></thead><tbody>\n<tr><td><code>A.1.1</code></td><td>Identifikace pacienta</td><td>Resortní identifikátor a identifikační údaje pacienta.</td></tr>\n<tr><td><code>A.1.2</code></td><td>Kontaktní informace pacienta</td><td>Adresu, kontaktní údaje a kontaktní osoby. Typ kontaktní osoby rozlišuje emergentní kontakty, zákonné zástupce a ostatní osoby se vztahem k pacientovi.</td></tr>\n<tr><td><code>A.1.3</code></td><td>Zdravotní pojištění</td><td>Zdravotní pojišťovna a pojistný vztah pacienta. Pojišťovna nemusí být plátcem vyžádané péče.</td></tr>\n<tr><td><code>A.1.4</code></td><td>Úhrada</td><td>Způsob úhrady vyžádané péče.</td></tr>\n<tr><td><code>A.1.5</code></td><td>Objednatel</td><td>Žadatel, tedy poskytovatel, pracoviště a osoby, které žádanku sepsaly a podepsaly.</td></tr>\n<tr><td><code>A.1.6</code></td><td>Provádějící</td><td>Poskytovatel vyžádané péče <strong>doporučený při vystavení</strong>. U neadresné eŽádanky nemusí být uveden. Skutečně provádějícího poskytovatele nese systémová hlavička, ne tento prvek.</td></tr>\n<tr><td><code>A.1.7</code></td><td>Příjemce nálezu</td><td>Dodateční příjemci výsledku vedle objednatele, tak jak je žadatel určil <strong>při vystavení</strong>. Rozesílání výsledku řídí systémová hlavička, ne tento prvek.</td></tr>\n<tr><td><code>A.1.8</code></td><td>Metadata dokumentu</td><td>Údaje o dokumentu jako takovém, například jeho identifikátor, kategorie, datum vytvoření a správce.</td></tr>\n<tr><td><code>A.1.9</code></td><td>Elektronické podpisy</td><td>Elektronický podpis nebo pečeť dokumentu podle zákona č. 327/2011 Sb., § 54a, a časové razítko.</td></tr>\n</tbody></table>\n<p>Prvky <code>A.1.1</code> a <code>A.1.2</code> nese v modelu jeden prvek, protože identifikace pacienta a jeho kontaktní informace jsou modelovány společně.</p>\n<h5 id=\"telo-dokumentu\"><span class=\"secno\">2.3.2</span> Tělo dokumentu</h5>\n<p>Tělo je v sekci <code>A.2</code> pro oba typy shodné.</p>\n<table class=\"grid\">\n<thead><tr><th>Číslo</th><th>Prvek</th><th>Co nese</th></tr></thead><tbody>\n<tr><td><code>A.2.1</code></td><td>Informace o objednávce</td><td>Identifikátor a datum objednávky, požadovaný termín provedení, urgentnost, text objednávky a informace pro pacienta.</td></tr>\n<tr><td><code>A.2.2</code></td><td>Odůvodnění vyšetření</td><td>Indikační diagnózu, klinickou otázku a důvod objednávky, kódem i textem. V modelu je součástí prvku <code>A.2.1</code>.</td></tr>\n<tr><td><code>A.2.3</code></td><td>Klinická událost</td><td>Kontext poskytnutí péče, ke kterému se žádanka váže, například návštěvu ambulance, při níž žádanka vznikla.</td></tr>\n<tr><td><code>A.2.4</code></td><td>Úhrada</td><td>Údaje ke způsobu platby za vyžádanou péči v těle dokumentu, včetně informací o plátci a komentáře.</td></tr>\n<tr><td><code>A.2.5</code></td><td>Termín návštěvy</td><td>Požadovaný nebo dohodnutý termín provedení, jeho délku, místo a instrukce pro pacienta.</td></tr>\n<tr><td><code>A.2.6</code></td><td>Informace o vzorku</td><td>Údaje o biologickém vzorku pro případy, kdy je předmětem požadavku jeho vyšetření.</td></tr>\n</tbody></table>\n<h5 id=\"podpurne-informace-a-datove-elementy\"><span class=\"secno\">2.3.3</span> Podpůrné informace a datové elementy</h5>\n<table class=\"grid\">\n<thead><tr><th>Číslo</th><th>Prvek</th><th>Co nese</th></tr></thead><tbody>\n<tr><td><code>A.3.1</code></td><td>Klinické informace</td><td>Údaje sdělované poskytovateli vyžádané péče, které mají vliv na její poskytnutí nebo na interpretaci výsledku: biometrické údaje, další relevantní klinické informace, medikaci, implantáty, urgentní informace, omezení pohyblivosti pacienta, fyzikální nález, datum hospitalizace, očkování a další formalizované údaje.</td></tr>\n<tr><td><code>A.3.2</code></td><td>Datové elementy objednávky</td><td>Vymezení požadované péče. Obsah se mezi typy K a FT liší, viz níže.</td></tr>\n<tr><td><code>A.3.3</code></td><td>Objednávky plánované péče</td><td>Odkazy na objednávky plánované péče navazující na tuto žádanku.</td></tr>\n<tr><td><code>A.3.4</code></td><td>Ostatní podpůrné informace</td><td>Ostatní podpůrné informace, například termín, ke kterému je výsledek potřebný.</td></tr>\n</tbody></table>\n<h6 id=\"datove-elementy-objednavky-u-konziliarni-zadanky\"><span class=\"secno\">2.3.3.1</span> Datové elementy objednávky u konziliární žádanky</h6>\n<table class=\"grid\">\n<thead><tr><th>Číslo</th><th>Prvek</th><th>Co nese</th></tr></thead><tbody>\n<tr><td><code>A.3.2.1</code></td><td>Požadované vyšetření</td><td>Kód a název požadované služby a poznámku objednatele. Blok se může opakovat.</td></tr>\n<tr><td><code>A.3.2.2</code></td><td>Závažná anamnestická data</td><td>Textový popis anamnestických údajů významných pro požadovanou péči.</td></tr>\n<tr><td><code>A.3.2.3</code></td><td>Výsledky provedených vyšetření</td><td>Souhrn nebo výběr výsledků již provedených vyšetření relevantních pro klinické rozhodování.</td></tr>\n<tr><td><code>A.3.2.4</code></td><td>Diferenciálně diagnostická rozvaha</td><td>Zvažované diagnózy a jejich zdůvodnění.</td></tr>\n<tr><td><code>A.3.2.5</code></td><td>Současná léčba, medikace včetně dávkování</td><td>Přehled probíhající léčby včetně dávkování.</td></tr>\n<tr><td><code>A.3.2.6</code></td><td>Zapůjčená dokumentace</td><td>Seznam nebo popis zapůjčené zdravotnické dokumentace přiložené k objednávce.</td></tr>\n</tbody></table>\n<h6 id=\"datove-elementy-objednavky-u-zadanky-o-fyzioterapii\"><span class=\"secno\">2.3.3.2</span> Datové elementy objednávky u žádanky o fyzioterapii</h6>\n<table class=\"grid\">\n<thead><tr><th>Číslo</th><th>Prvek</th><th>Co nese</th></tr></thead><tbody>\n<tr><td><code>A.3.2.1</code></td><td>Požadované vyšetření</td><td>Kód a název požadované péče, část těla, lateralitu, počet, frekvenci, poznámku a požadované místo poskytnutí péče, například domácí prostředí pacienta. Blok se může opakovat.</td></tr>\n<tr><td><code>A.3.2.2</code></td><td>Cíl vyšetření</td><td>Cíl, kterého má být terapií dosaženo.</td></tr>\n</tbody></table>\n<p>V modelu obecné indikace s delegovaným rozsahem ošetřující lékař konkrétní výkony neuvádí a požadovanou péči vyjadřuje pouze její kategorií.</p>\n<h5 id=\"prezentovana-forma\"><span class=\"secno\">2.3.4</span> Prezentovaná forma</h5>\n<p>Lidsky čitelná podoba dokumentu v požadovaném formátu PDF. Nese typ obsahu, jazyk, název, data nebo URL obsahu a datum vytvoření.</p>\n<h5 id=\"prilohy\"><span class=\"secno\">2.3.5</span> Přílohy</h5>\n<p>Ostatní přílohy, kterými lze doplnit strukturovaný obsah, například ambulantní nebo propouštěcí zprávy, obrazovou dokumentaci nebo data poskytnutá pacientem. Příloha nenahrazuje strukturovaný údaj: údaj, pro který je v logickém modelu definován strukturovaný prvek, musí být uveden tímto prvkem.</p>\n<p>Přílohy eŽádanky je třeba odlišit od dokumentů zásilky, kterou se předává výsledek při vyřízení eŽádanky. Ty se řídí pravidly Dočasného úložiště a s tělem eŽádanky nesouvisejí.</p>", "num": 2, "toc": [{"l": 3, "t": "Oblasti řešení", "s": "oblasti-reseni"}, {"l": 4, "t": "Zahrnuté oblasti", "s": "zahrnute-oblasti"}, {"l": 4, "t": "Nezahrnuté oblasti", "s": "nezahrnute-oblasti"}, {"l": 3, "t": "Obsah", "s": "obsah"}, {"l": 4, "t": "Informační modely", "s": "informacni-modely"}, {"l": 4, "t": "Subjekty", "s": "subjekty"}, {"l": 4, "t": "Objekty", "s": "objekty"}, {"l": 3, "t": "Struktura žádanky", "s": "struktura-zadanky"}, {"l": 4, "t": "Hlavička dokumentu", "s": "hlavicka-dokumentu"}, {"l": 4, "t": "Tělo dokumentu", "s": "telo-dokumentu"}, {"l": 4, "t": "Podpůrné informace a datové elementy", "s": "podpurne-informace-a-datove-elementy"}, {"l": 4, "t": "Prezentovaná forma", "s": "prezentovana-forma"}, {"l": 4, "t": "Přílohy", "s": "prilohy"}], "title": "Rozsah použití a obsah", "file": "scope-and-content-cs.md", "changes": ["Stránka měla 263 B a tvořily ji tři diagramy bez textu. Nově má stejnou osnovu jako img-order: Oblasti řešení, Obsah a Struktura žádanky.", "Původní nadpisy diagramů jsou zachovány — Skladba žádanky, Hlavička žádanky a Tělo žádanky. Přesunuly se pod Koncepční pohled, kde je nově i kostra logického modelu A.1 až A.5.", "Nové: Zahrnuté oblasti vymezují oba typy a u typu FT oba modely preskripce. Obory hodnot, kterými se požadovaná péče vyjadřuje, se tu neuvádějí — vazba na SNOMED CT je pouze `preferred`, takže by na tomto místě definici typu zkreslovala. Odkazuje se na stránku Terminologické aspekty.", "Nové: Nezahrnuté oblasti — ostatní typy eŽádanky bez jmenování konkrétního typu, chování systému eŽádanky, systémová hlavička, klinické scénáře, vykazování a úhrada, a terapeutický plán sestavený terapeutem v modelu s delegovaným rozsahem.", "Nové: tabulky prvků A.1.1 až A.1.9, A.2.1 až A.2.6 a A.3.1 až A.3.4, a k tomu dvě typové tabulky prvku A.3.2, jedna pro konziliární žádanku a jedna pro žádanku o fyzioterapii.", "U prvků A.1.6 a A.1.7 je doplněno, že chování systému řídí systémová hlavička, ne tyto prvky.", "Doplněno, že prvky A.1.1 a A.1.2 nese v modelu jeden prvek a že prvek A.2.2 je v modelu součástí prvku A.2.1. Bez toho čísla prvků v modelu nedohledáte.", "Prvek A.1.6 se nazývá Provádějící a sekce A.4 Prezentovaná forma, tedy tak, jak je nazývají modely dokumentu a jak je nazývá Obecná funkční specifikace. Samotný model sekce A.4 je nazván Vizuální podoba dokumentu, viz otevřené body. Model se podle pravidla z 4. 9. nepřejmenovává.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|background": {"body": "<h4 id=\"poukaz-k-a-ft\"><span class=\"secno\">3.1</span> Poukaz K a FT</h4>\n<p>Papírovými vzory pro tyto dva typy eŽádanky jsou <strong>Poukaz na vyšetření/ošetření typu K</strong> a <strong>Poukaz na fyzioterapii/ergoterapii typu FT</strong>. Aktuální verze tiskopisů jsou dostupné na stránkách <a href=\"https://www.vzp.cz/poskytovatele/tiskopisy\" target=\"_blank\" rel=\"noopener\">VZP – tiskopisy pro poskytovatele</a>.</p>\n<p>Stejně jako jiné zdravotnické dokumenty využívají oba typy standardy a terminologické systémy používané v českém i evropském prostředí elektronického zdravotnictví. Jde zejména o HL7 FHIR, SNOMED CT, MKN-10 a národní číselníky a identifikátory, u požadovaných výkonů také o číselníky zdravotních pojišťoven. Přehled použitých code systémů a oborů hodnot je na stránce <a href=\"#/k-order/terminology-considerations-cs\">Terminologické aspekty</a>.</p>\n<p>Požadavky na obsah vyžádání dalších zdravotních služeb stanoví <code>příloha č. 1 v části 2 k vyhlášce č. 444/2024 Sb., o zdravotnické dokumentaci</code>. Ve znění k 19. 2. 2025 obsahuje vyžádání dalších zdravotních služeb:</p>\n<ul class=\"legis\">\n<li>a) požadované zdravotní služby,</li>\n<li>b) zdůvodnění požadavku,</li>\n<li>c) naléhavost požadavku,</li>\n<li>d) údaje o posledně zjištěném zdravotním stavu, včetně těch výsledků laboratorních a dalších pomocných vyšetření, které jsou podstatné pro poskytnutí vyžádaných zdravotních služeb,</li>\n<li>e) údaje o dosavadní léčbě a reakci pacienta na ni,</li>\n<li>f) pracovní diagnózu,</li>\n<li>g) uvedení zásadních anamnestických údajů souvisejících s požadovanými zdravotními službami.</li>\n</ul>\n<p>Tato implementační příručka převádí uvedené legislativní požadavky do interoperabilní elektronické podoby založené na standardu HL7 FHIR R4. Které prvky logického modelu jednotlivé požadavky naplňují, uvádí Speciální funkční specifikace příslušného typu, tedy Funkční specifikace eŽádanky K a Funkční specifikace eŽádanky FT.</p>", "num": 3, "toc": [{"l": 3, "t": "Poukaz K a FT", "s": "poukaz-k-a-ft"}], "title": "Background", "file": "background-cs.md", "changes": ["Zachován původní nadpis Poukaz K a FT.", "Vypuštěny tři odstavce, které se překrývají s Domovskou stránkou a s Rozsahem použití: společná báze a odlišnost v části body, popis obou typů a odstavec o cíli sjednotit reprezentaci požadavkových dokumentů.", "Doplněn papírový vzor typu FT. Originál uváděl jen Poukaz typu K a související formuláře.", "Výčet obsahu vyžádání podle vyhlášky č. 444/2024 Sb. je nově strukturovaný seznam a) až g) podle znění přílohy. Dosud to byl volný výčet bez označení bodů.", "Doplněn odkaz na stránku Terminologické aspekty a věta, že které prvky modelu jednotlivé požadavky naplňují, uvádí obě speciální funkční specifikace.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|use-cases": {"body": "<p>Případy užití a klinické scénáře popisují speciální funkční specifikace obou typů: <strong>Funkční specifikace eŽádanky K</strong> pro konziliární žádanku a <strong>Funkční specifikace eŽádanky FT</strong> pro žádanku o fyzioterapii. Tato příručka je neopisuje. Umístění dokumentů uvádí <a href=\"#/k-order/index-cs\">Domovská stránka</a> v oddílu Vztah k ostatní dokumentaci.</p>\n<p>Instance, které jednotlivé scénáře realizují, jsou na stránce <a href=\"#/k-order/examples-cs\">Příklady</a>.</p>", "num": 4, "toc": [], "title": "Případy užití", "file": "use-cases-cs.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Dva odstavce: případy užití a klinické scénáře popisují Funkční specifikace eŽádanky K a Funkční specifikace eŽádanky FT, příručka je neopisuje, a instance, které je realizují, jsou na stránce Příklady.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|workflow": {"body": "<p>Tato příručka specifikuje dokument, ne proces. Životní cyklus eŽádanky je vlastností systému, kterým se dokument vyměňuje — v českém prostředí jej nese systémová hlavička a jeho stavy, přechody a operace popisuje Standard systému eŽádanka. FHIR Bundle je sestaven a podepsán při vystavení a dál se nemění, viz <a href=\"#/k-order/implementation-notes-cs\">Poznámky k implementaci</a>. Je-li dokument vyměňován v jiném kontextu než systémem eŽádanka, platí procesní pravidla toho kontextu.</p>\n<p>Zdroje v bundlu mají vlastní prvky <code>status</code>, například <code>Composition.status</code> nebo <code>ServiceRequest.status</code>, a vyjadřují stav dokumentu a požadavku v okamžiku vystavení.</p>\n<p>Obor hodnot <a href=\"https://hl7.org/fhir/R4/valueset-request-status.html\" target=\"_blank\" rel=\"noopener\">RequestStatus</a> není stavovým modelem eŽádanky a nelze jej za něj vydávat, protože jeho hodnoty a stavy, které systém eŽádanka rozlišuje, se nekryjí ani v jednom směru. Stav eŽádanky nese systémová hlavička, viz <a href=\"#/k-order/index-cs\">Domovská stránka</a>, oddíl Dvě části eŽádanky. Totéž platí pro prvek <code>A.1.8.3 Stav dokumentu</code>.</p>", "num": 5, "toc": [], "title": "Workflow", "file": "workflow-cs.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Tři odstavce bez nadpisů. Nese jedinou věc, kterou neříká žádný jiný dokument sady: že prvky status ve zdrojích bundlu nejsou stavem eŽádanky.", "Stavový model se neopisuje. Stavy, přechody a operace popisuje Standard systému eŽádanka, odkazuje se na něj.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|logical-models": {"body": "<p>Tato stránka uvádí logické modely HL7 FHIR používané k reprezentaci konziliární žádanky a žádanky o fyzioterapii.</p>\n<p>Kostra logického modelu je pro všechny typy eŽádanek jednotná, viz <a href=\"#/k-order/scope-and-content-cs#koncepční-pohled\">Rozsah použití a obsah</a>. Číslo prvku označuje tentýž údaj bez ohledu na typ eŽádanky a bez ohledu na to, ve které implementační příručce je definován. Na položky se proto odkazuje <strong>číslem a názvem prvku</strong>, nikoli názvem modelu — názvy modelů se mezi příručkami liší.</p>\n<p>Sekce <code>A.1</code>, <code>A.2</code>, <code>A.4</code> a <code>A.5</code> jsou společné všem typům eŽádanek. Sekci <code>A.3</code> doplňuje v prvku <code>A.3.2</code> model konkrétního typu.</p>\n<p>Následující tři modely popisují dokument jako celek. Model obecné žádanky je kostrou bez typového obsahu, modely K-žádanky a FT-žádanky se od něj liší pouze modelem použitým pro tělo dokumentu.</p>\n<div class=\"gen\">Zde publikátor IG vygeneruje tabulku logických modelů.</div>\n<p>Následující modely popisují jednotlivé sekce a prvky. Jejich názvy začínají číslem prvku, podle kterého jsou seřazeny.</p>\n<div class=\"gen\">Zde publikátor IG vygeneruje tabulku logických modelů. Dotaz: <code>Name LIKE 'LMCz%'</code>.</div>\n<p>Anglická verze modelů je uvedena na anglické verzi této stránky, viz <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Logical models</span>.</p>", "num": 6, "toc": [], "title": "Logické modely", "file": "logical-models-cs.md", "changes": ["Doplněno pravidlo, že kostra logického modelu je jednotná napříč typy i příručkami a že se na prvky odkazuje číslem a názvem prvku.", "Doplněno, které sekce jsou společné a že sekci A.3 doplňuje v prvku A.3.2 model konkrétního typu.", "Opraven výběr modelů. Původní tři dotazy na LMG%, LMK% a LMF% vracely pouze tři modely dokumentu, kdežto všech 25 modelů sekcí a prvků má název začínající LMCz% a na stránce se vůbec nezobrazovalo. Nově jeden dotaz vypisuje modely dokumentu a druhý modely sekcí.", "V anglické verzi je druhý dotaz na LMEn%. Anglická sada modelů je menší než česká, viz otevřené body.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|terminology-considerations": {"body": "<p>Následuje seznam použitých code systémů a oborů hodnot, členěný podle zdroje terminologie. Každý prvek logického modelu je uveden právě jednou, v sekci systému, který je pro něj rozhodující. Připouští-li prvek i jiný systém, je uveden ve sloupci Hodnota jako alternativa. Liší-li se obor hodnot mezi typy K a FT, je to u prvku uvedeno.</p>\n<p>Národní obory hodnot publikuje <a href=\"https://hl7.cz/terminology/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Terminology Implementation Guide</a> a jejich hodnoty jsou dostupné prostřednictvím terminologického serveru <strong>TermX</strong>. U číselníků zdravotních pojišťoven je autoritativním zdrojem balík číselníků poskytovaný v rámci smluvního vztahu, veřejně publikované stránky mají pouze informativní povahu. Existuje-li pro prvek národní obor hodnot, použije se přednostně před mezinárodním.</p>\n<h4 id=\"snomed-ct\"><span class=\"secno\">7.1</span> Snomed-CT</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>A.2.2.2</td><td>Klinická otázka kódem</td><td>SNOMED CT</td></tr>\n<tr><td>A.2.2.4</td><td>Důvod objednávky kódem</td><td>SNOMED CT</td></tr>\n<tr><td>A.3.1.4.1</td><td>Druh implantátu</td><td>SNOMED CT, obor hodnot určuje profil zdravotnického prostředku v <a href=\"https://hl7.cz/fhir/core/index.html\" target=\"_blank\" rel=\"noopener\">HL7 Czech Base and Core Implementation Guide</a></td></tr>\n<tr><td>A.3.1.4.4</td><td>Část těla implantátu</td><td><a href=\"https://hl7.org/fhir/valueset-body-site.html\" target=\"_blank\" rel=\"noopener\">body-site</a>, SNOMED CT Body structure</td></tr>\n<tr><td>A.3.1.6.2</td><td>Omezení pohyblivosti – kód informace</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-mobility-type</span> — čtyři kódy typu hodnoceného úkonu: chůze, vstávání, stání a pohyb na lůžku</td></tr>\n<tr><td>A.3.1.6.3</td><td>Omezení pohyblivosti – hodnota informace</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-mobility-value</span> — osm kódů hodnocení k typům výše</td></tr>\n<tr><td>A.3.1.10</td><td>Fyzikální nález</td><td>SNOMED CT, klinické nálezy</td></tr>\n<tr><td>A.3.1.12</td><td>Očkování</td><td>SNOMED CT</td></tr>\n<tr><td>A.3.2.1.1</td><td>Kód vyšetření</td><td>U typu K <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-procedures-vs</span>, potomci konceptu <code>11429006</code> Consultation. U typu FT <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-order-procedures-vs</span>, potomci konceptu <code>91251008</code> Physical therapy procedure. U obou typů je vazba <code>preferred</code>, alternativou jsou výkony zdravotních pojišťoven, viz níže.</td></tr>\n<tr><td>A.3.2.1.3</td><td>Část těla požadované péče (FT)</td><td>SNOMED CT, Body structure</td></tr>\n<tr><td>—</td><td>Kategorie požadavku, <code>ServiceRequest.category</code></td><td>U typu FT <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-category-service-request</span> — <code>91251008</code> fyzioterapie, <code>84478008</code> ergoterapie. Kategorie odlišuje oba modely preskripce, protože v modelu s delegovaným rozsahem je jediným vyjádřením požadované péče.</td></tr>\n</tbody></table>\n<p>Preferovaným způsobem vyjádření požadované péče je SNOMED CT; preference je vyjádřena silou vazby v profilu. U typu FT je koncept SNOMED CT <code>91251008</code> z oboru hodnot požadovaných výkonů vyloučen, protože obecná fyzioterapie se vyjadřuje kategorií požadavku, ne výkonem.</p>\n<h4 id=\"mkn-10-orphacode\"><span class=\"secno\">7.2</span> MKN-10 / Orphacode</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>A.2.2.1</td><td>Popis problému / diagnózy / stavu – indikační diagnóza</td><td><a href=\"https://uzis.cz/terminology/ValueSet/mkn-10\" target=\"_blank\" rel=\"noopener\">mkn-10</a> a <a href=\"https://ncez.mzcr.cz/terminology/ValueSet/orphanet-rare-diseases\" target=\"_blank\" rel=\"noopener\">orphanet-rare-diseases</a>, u obou typů vazbou <code>preferred</code></td></tr>\n<tr><td>A.3.1.2.1</td><td>Kód informace – vedlejší diagnóza</td><td><a href=\"https://uzis.cz/terminology/ValueSet/mkn-10\" target=\"_blank\" rel=\"noopener\">mkn-10</a></td></tr>\n</tbody></table>\n<p>Národní obor hodnot <a href=\"https://ncez.mzcr.cz/terminology/ValueSet/condition-cz\" target=\"_blank\" rel=\"noopener\">condition-cz</a> sdružuje MKN-10, ORPHA i klinické nálezy SNOMED CT do jednoho oboru hodnot a je pro indikační diagnózu použitelný jako celek.</p>\n<h4 id=\"nclppol\"><span class=\"secno\">7.3</span> NČLPPOL</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>A.3.1.1.1.2</td><td>Váha – kód</td><td><a href=\"https://ncez.mzcr.cz/nclp/ValueSet/nclppol\" target=\"_blank\" rel=\"noopener\">nclppol</a> <code>20042</code>, alternativně SNOMED CT <code>27113001</code></td></tr>\n<tr><td>A.3.1.1.2.2</td><td>Výška – kód</td><td><a href=\"https://ncez.mzcr.cz/nclp/ValueSet/nclppol\" target=\"_blank\" rel=\"noopener\">nclppol</a> <code>20411</code>, alternativně SNOMED CT <code>1153637007</code></td></tr>\n</tbody></table>\n<h4 id=\"ciselniky-zdravotnich-pojistoven\"><span class=\"secno\">7.4</span> Číselníky zdravotních pojišťoven</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>A.1.4.3</td><td>Kód náhrady</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">vzp-nahrady-vs</span> — sedm kódů náhrad za zdravotní péči, například úraz zaviněný jinou osobou nebo pracovní úraz</td></tr>\n</tbody></table>\n<p>Výkony zdravotních pojišťoven jsou u prvku <code>A.3.2.1.1 Kód vyšetření</code> alternativou k SNOMED CT. Příručka pro ně definuje dva code systémy, <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-vzp-procedures-cs</span> pro výkony a <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-vzp-procedures-cs</span> pro výkony fyzioterapie. Oba jsou označeny jako <code>fragment</code> a obsahují pouze demonstrační podmnožinu kódů použitou v příkladech; závazným zdrojem je balík číselníků pojišťovny.</p>\n<h4 id=\"loinc\"><span class=\"secno\">7.5</span> LOINC</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>A.1.8.2</td><td>Kategorie dokumentu</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/document-category\" target=\"_blank\" rel=\"noopener\">document-category</a></td></tr>\n<tr><td>—</td><td>Typ žádanky, <code>Composition.type</code></td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/referralorder-types\" target=\"_blank\" rel=\"noopener\">referralorder-types</a> — pro typ K kód <code>57133-1</code>, pro typ FT kód <code>57154-7</code></td></tr>\n</tbody></table>\n<p>Prvek <code>Composition.type</code> nese typ žádanky z národního oboru hodnot Typy žádanek. Je to jediný prvek hlavičky, jehož hodnota se mezi typy K a FT liší. Pro typ žádanky není v logickém modelu definován prvek <code>A.x</code>, proto je v tabulce uveden bez čísla.</p>\n<h4 id=\"fhir\"><span class=\"secno\">7.6</span> FHIR</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>A.1.1.6</td><td>Státní občanství</td><td><a href=\"https://terminology.hl7.org/ValueSet-v3-Country2.html\" target=\"_blank\" rel=\"noopener\">v3-Country2</a></td></tr>\n<tr><td>A.1.1.7</td><td>Pohlaví</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/administrative-gender-cz\" target=\"_blank\" rel=\"noopener\">administrative-gender-cz</a></td></tr>\n<tr><td>A.1.1.9</td><td>Komunikační jazyk</td><td><a href=\"https://hl7.org/fhir/valueset-all-languages.html\" target=\"_blank\" rel=\"noopener\">all-languages</a></td></tr>\n<tr><td>A.1.2.1</td><td>Adresa – země</td><td><a href=\"https://terminology.hl7.org/ValueSet-v3-Country2.html\" target=\"_blank\" rel=\"noopener\">v3-Country2</a></td></tr>\n<tr><td>A.1.2.4.1</td><td>Typ kontaktu</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/contactrole-cz\" target=\"_blank\" rel=\"noopener\">contactrole-cz</a></td></tr>\n<tr><td>A.1.4.1</td><td>Způsob úhrady</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/cz-coverage-type\" target=\"_blank\" rel=\"noopener\">cz-coverage-type</a> — <code>HIP</code> zdravotní pojištění, <code>pay</code> samoplátce</td></tr>\n<tr><td>A.1.8.3</td><td>Stav dokumentu</td><td><a href=\"https://hl7.org/fhir/valueset-composition-status.html\" target=\"_blank\" rel=\"noopener\">composition-status</a> — <code>preliminary</code>, <code>final</code>, <code>amended</code>, <code>entered-in-error</code>. Prvek se mapuje na <code>Composition.status</code>, kde je vazba povinná už v základním zdroji, a profil ji nezužuje.</td></tr>\n<tr><td>A.1.8.7</td><td>Důvěrnost dokumentu</td><td><a href=\"https://terminology.hl7.org/ValueSet-v3-Confidentiality.html\" target=\"_blank\" rel=\"noopener\">v3-Confidentiality</a></td></tr>\n<tr><td>A.1.8.8</td><td>Jazyk dokumentu</td><td><a href=\"https://hl7.org/fhir/valueset-all-languages.html\" target=\"_blank\" rel=\"noopener\">all-languages</a></td></tr>\n<tr><td>A.2.1.4</td><td>Urgentnost objednávky</td><td><a href=\"https://hl7.org/fhir/valueset-request-priority.html\" target=\"_blank\" rel=\"noopener\">request-priority</a> — <code>routine</code>, <code>urgent</code>, <code>asap</code>, <code>stat</code>. Příručka k němu definuje obor hodnot <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-priority-vs</span> s českými názvy hodnot běžně, urgentně a statim.</td></tr>\n<tr><td>A.2.4.1</td><td>Způsob úhrady v těle dokumentu</td><td><a href=\"https://ncez.mzcr.cz/terminology/ValueSet/cz-coverage-type\" target=\"_blank\" rel=\"noopener\">cz-coverage-type</a></td></tr>\n<tr><td>A.2.5.2</td><td>Stav termínu</td><td><a href=\"https://hl7.org/fhir/valueset-appointmentstatus.html\" target=\"_blank\" rel=\"noopener\">appointmentstatus</a></td></tr>\n<tr><td>A.4.1, A.5.1</td><td>Typ obsahu prezentované formy a přílohy</td><td>MIME typ, <a href=\"https://www.rfc-editor.org/rfc/rfc2046\" target=\"_blank\" rel=\"noopener\">urn:ietf:bcp:13</a></td></tr>\n<tr><td>A.4.2, A.5.2</td><td>Jazyk obsahu prezentované formy a přílohy</td><td><a href=\"https://hl7.org/fhir/valueset-all-languages.html\" target=\"_blank\" rel=\"noopener\">all-languages</a></td></tr>\n</tbody></table>\n<p>Prvek <code>A.1.8.3 Stav dokumentu</code> vyjadřuje stav dokumentu v okamžiku vystavení, ne stav eŽádanky v systému. Ten je vlastností systému, ne dokumentu, viz <a href=\"#/k-order/workflow-cs\">Workflow</a>.</p>\n<h4 id=\"doporuceni-prevzeti-do-pece\"><span class=\"secno\">7.7</span> Doporučení převzetí do péče</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>—</td><td>Doporučení převzetí do péče u typu K</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-recommendation-disposition-vs</span> — <code>ambulatory-care</code> převzetí do péče, <code>hospitalization</code> hospitalizace</td></tr>\n</tbody></table>\n<p>Doporučení převzetí do péče nese u typu K rozšíření profilu požadované služby a vazba oboru hodnot je <code>required</code>. Scénář doporučení převzetí do ambulantní nebo ústavní péče popisuje Funkční specifikace eŽádanky K. Pro tento údaj není v logickém modelu definován prvek <code>A.x</code>, proto je v tabulce uveden bez čísla.</p>\n<h4 id=\"ucum\"><span class=\"secno\">7.8</span> UCUM</h4>\n<table class=\"grid\">\n<thead><tr><th>Kód položky</th><th>Popis položky</th><th>Hodnota</th></tr></thead><tbody>\n<tr><td>A.3.1.1.1.1</td><td>Hodnota váhy – jednotka</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-observation-units-weight-vs</span> — <code>kg</code>, <code>g</code></td></tr>\n<tr><td>A.3.1.1.2.1</td><td>Hodnota výšky – jednotka</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">cz-observation-units-height-vs</span> — <code>m</code>, <code>cm</code></td></tr>\n</tbody></table>\n<h4 id=\"prvky-bez-navazaneho-oboru-hodnot\"><span class=\"secno\">7.9</span> Prvky bez navázaného oboru hodnot</h4>\n<p>U následujících kódovaných prvků příručka obor hodnot dosud nenavazuje, protože pro ně nemá profil nebo vazbu: <code>A.1.5</code> odbornost objednatele, <code>A.3.1.5.1 Alergie a intolerance</code>, <code>A.3.2.1.4 Lateralita</code> u typu FT a kódované prvky <code>A.2.6 Informace o vzorku</code>. Do doby, než budou navázány, se pro ně použije terminologie uvedená v Obecné funkční specifikaci dokumentu eŽádanka.</p>", "num": 7, "toc": [{"l": 3, "t": "Snomed-CT", "s": "snomed-ct"}, {"l": 3, "t": "MKN-10 / Orphacode", "s": "mkn-10-orphacode"}, {"l": 3, "t": "NČLPPOL", "s": "nclppol"}, {"l": 3, "t": "Číselníky zdravotních pojišťoven", "s": "ciselniky-zdravotnich-pojistoven"}, {"l": 3, "t": "LOINC", "s": "loinc"}, {"l": 3, "t": "FHIR", "s": "fhir"}, {"l": 3, "t": "Doporučení převzetí do péče", "s": "doporuceni-prevzeti-do-pece"}, {"l": 3, "t": "UCUM", "s": "ucum"}, {"l": 3, "t": "Prvky bez navázaného oboru hodnot", "s": "prvky-bez-navazaneho-oboru-hodnot"}], "title": "Terminologické aspekty", "file": "terminology-considerations-cs.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Členění je podle číselníku, stejně jako v img-order a jako na odpovídající stránce publikovaného HL7 Czech Imaging Report IG: Snomed-CT, MKN-10 / Orphacode, NČLPPOL, číselníky zdravotních pojišťoven, LOINC, FHIR, doporučení převzetí do péče a UCUM. Sloupce jsou Kód položky, Popis položky, Hodnota.", "Každý prvek je uveden právě jednou. Liší-li se obor hodnot mezi typy K a FT, je to uvedeno u prvku, ne zdvojením řádku.", "Obory hodnot ověřeny proti publikovanému terminologickému IG 0.3.0 a proti profilům v repozitáři: cz-coverage-type u A.1.4.1 a A.2.4.1, condition-cz a mkn-10 u indikační diagnózy, administrative-gender-cz u pohlaví, contactrole-cz u typu kontaktu, document-category u kategorie dokumentu.", "Typ žádanky, Composition.type, je uveden s národním oborem hodnot referralorder-types a s kódy 57133-1 pro typ K a 57154-7 pro typ FT. V logickém modelu pro něj prvek A.x není, proto je uveden bez čísla. Totéž platí pro doporučení převzetí do péče, které nese rozšíření profilu.", "Uvedeno, že code systémy korder-vzp-procedures-cs a ft-vzp-procedures-cs jsou označeny jako fragment a obsahují jen demonstrační podmnožinu kódů použitou v příkladech, takže závazným zdrojem je balík číselníků pojišťovny.", "U omezení pohyblivosti jsou uvedeny oba obory hodnot, cz-mobility-type se čtyřmi kódy typu hodnoceného úkonu a cz-mobility-value s osmi kódy hodnocení.", "Poslední oddíl vyjmenovává kódované prvky, u kterých příručka obor hodnot dosud nenavazuje: odbornost objednatele, alergie a intolerance, lateralita u typu FT a kódované prvky informací o vzorku.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|model-map": {"body": "<p>Tato stránka obsahuje seznam stránek s grafickým znázorněním mapování mezi logickými modely a použitými FHIR profily.</p>\n<p><strong>Konziliární žádanka, typ K</strong></p>\n<table class=\"grid\">\n<thead><tr><th>Sekce logického modelu</th><th>Logický model</th><th>Mapování</th></tr></thead><tbody>\n<tr><td><code>A.1</code> Hlavička dokumentu</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Hlavička</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">K-Header-map</span></td></tr>\n<tr><td><code>A.2</code> a <code>A.3</code> Tělo dokumentu</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Tělo dokumentu K-žádanky</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">K-Body-map</span></td></tr>\n</tbody></table>\n<p><strong>Žádanka o fyzioterapii, typ FT</strong></p>\n<table class=\"grid\">\n<thead><tr><th>Sekce logického modelu</th><th>Logický model</th><th>Mapování</th></tr></thead><tbody>\n<tr><td><code>A.1</code> Hlavička dokumentu</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Hlavička</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">FT-Header-map</span></td></tr>\n<tr><td><code>A.2</code> a <code>A.3</code> Tělo dokumentu</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Tělo dokumentu FT-žádanky</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">FT-Body-map</span></td></tr>\n</tbody></table>\n<p><strong>Společné pro oba typy</strong></p>\n<table class=\"grid\">\n<thead><tr><th>Sekce logického modelu</th><th>Logický model</th><th>Mapování</th></tr></thead><tbody>\n<tr><td><code>A.4</code> Prezentovaná forma</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Prezentovaná forma</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Attatchmant-map</span></td></tr>\n<tr><td><code>A.5</code> Přílohy</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Přílohy</span></td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Attatchmant-map</span></td></tr>\n</tbody></table>", "num": 8, "toc": [], "title": "Mapování logického modelu", "file": "model-map-cs.md", "changes": ["Doplněn sloupec se sekcí logického modelu a odkazy na samotné logické modely, dosud stránka odkazovala jen na mapovací stránky.", "Doplněny sekce A.4 a A.5 s odkazem na stránku Attatchmant-map. Ta v repozitáři existuje, ale neodkazovala na ni žádná stránka a nebyla uvedena v konfiguraci, takže se nepublikovala.", "Popisky odkazů sjednoceny s cíli. Původní tabulka měla u obou typů texty Header-map.html a Body-map.html bez ohledu na to, kam odkaz vede.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|examples": {"body": "<h4 id=\"priklady-konziliarni-zadanky\"><span class=\"secno\">9.1</span> Příklady konziliární žádanky</h4>\n<p>Příklady instancí jsou publikovány v této příručce. Funkční specifikace eŽádanky K uvádí tytéž příklady pod stejnými názvy a v témže pořadí, ale bez jejich obsahu.</p>\n<table class=\"grid\">\n<thead><tr><th>Příklad</th><th>Co demonstruje</th><th>Instance</th></tr></thead><tbody>\n<tr><td>Kardiologické konzilium pro námahovou dušnost</td><td>Neadresná eŽádanka s více požadovanými službami v jednom dokumentu, konziliárním vyšetřením a echokardiografií, a s dodatečným příjemcem výsledku. Praktický lékař žádá o posouzení, zda je zhoršující se námahová dušnost kardiálního původu.</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleKOrderExample</span></td></tr>\n<tr><td>Dermatologické konzilium pro suspektní pigmentový útvar</td><td>Adresná eŽádanka se zvýšenou naléhavostí a s obrazovou přílohou, která doplňuje strukturovaný obsah. Praktický lékař odesílá pacienta s rychle se měnícím pigmentovým útvarem do konkrétní pigmentové poradny.</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleDermatologyUrgentExample</span></td></tr>\n<tr><td>Nefrologické konzilium při progresi chronického onemocnění ledvin</td><td>eŽádanka ve scénáři doporučení převzetí do péče, tedy nikoli jednorázového posouzení. Nese hodnoty kreatininu a eGFR jako podpůrné klinické informace.</td><td><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleNephrologyHandoverExample</span></td></tr>\n</tbody></table>\n<h4 id=\"priklady-zadanky-o-fyzioterapii\"><span class=\"secno\">9.2</span> Příklady žádanky o fyzioterapii</h4>\n<table class=\"grid\">\n<thead><tr><th>Příklad</th><th>Co demonstruje</th><th>Instance</th></tr></thead><tbody>\n<tr><td>Rehabilitace po totální endoprotéze kyčle</td><td>Neadresná eŽádanka u pacienta se sníženou mobilitou a implantátem. Na eŽádance je datum operace, povolená zátěž operované končetiny, typ implantátu a snížená mobilita pacienta.</td><td>připravuje se</td></tr>\n<tr><td>Respirační fyzioterapie u pacienta s chronickou obstrukční plicní nemocí</td><td>Kompletně vyplněný poukaz s počtem procedur a s péčí v místě pobytu pacienta. Uvedeny jsou konkrétní výkony, deset procedur, dvakrát týdně, terapie se provádí u pacienta doma.</td><td>připravuje se</td></tr>\n<tr><td>Fyzioterapie u dětského pacienta s vadným držením těla</td><td>Částečně vyplněný poukaz, kde rozsah péče navrhuje fyzioterapeut. Uvedena je jen diagnóza a cíl terapie, konkrétní výkony ani jejich počet vyplněny nejsou. Součástí eŽádanky je zákonný zástupce.</td><td>připravuje se</td></tr>\n</tbody></table>\n<p>Příklady odpovídají Tabulce 7 ve Funkční specifikaci eŽádanky FT. Do doby, než budou dodány, je v příručce publikován technický příklad <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">BundleFTExample</span>, který ukazuje detailní model preskripce: jeden požadovaný výkon odpovídá jednomu zdroji požadované služby.</p>\n<p>Všechny příklady lze nalézt rovněž na stránce <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Artifacts</span>.</p>\n<h4 id=\"priklady-profilu\"><span class=\"secno\">9.3</span> Příklady profilů</h4>\n<ul>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Kompozice konziliární žádanky</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Kompozice žádanky o fyzioterapii</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Požadovaná služba – konziliární vyšetření</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Požadovaná služba – fyzioterapeutický výkon</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Pacient</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Zdravotnický pracovník</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Role zdravotnického pracovníka</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Poskytovatel zdravotních služeb</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Podřízené pracoviště poskytovatele</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Zdravotní pojišťovna</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Pojistný vztah</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Indikační diagnóza</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Pozorování – kreatinin</span></li>\n<li><span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">Příloha – klinická fotodokumentace</span></li>\n</ul>", "num": 9, "toc": [{"l": 3, "t": "Příklady konziliární žádanky", "s": "priklady-konziliarni-zadanky"}, {"l": 3, "t": "Příklady žádanky o fyzioterapii", "s": "priklady-zadanky-o-fyzioterapii"}, {"l": 3, "t": "Příklady profilů", "s": "priklady-profilu"}], "title": "Příklady", "file": "examples-cs.md", "changes": ["Stránka vznikla v commitu f50b405 z 3. 9. 2026, tento návrh na ni navazuje. Zachovává její obsah a doplňuje ho.", "Nadpisy sjednoceny na úroveň h3 jako na ostatních stránkách příručky. Původní verze používala h1 a h2, takže vedle titulku stránky generovaného publikátorem vznikal druhý nadpis první úrovně.", "Názvy příkladů typu K sjednoceny s Tabulkou 6 ve Funkční specifikaci eŽádanky K 6.2, aby byla vazba mezi FS a IG jednoznačná. Rozdíly jsou malé: FS nemá u dermatologického příkladu slovo „urgentní“ a nefrologický příklad nazývá „Nefrologické konzilium při progresi chronického onemocnění ledvin“.", "Doplněn sloupec Co demonstruje s textem z FS, takže klinické scénáře se nemusí v IG opisovat.", "U typu FT jsou uvedeny všechny tři příklady z Tabulky 7 ve Funkční specifikaci eŽádanky FT 7.0 se sloupcem Co demonstruje a se stavem „připravuje se“ ve sloupci Instance. Narovná se to, až budou instance dodány. Existující technický příklad BundleFTExample je zmíněn pod tabulkou.", "Doplněn výčet příkladů profilů s odkazy na instance.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|cs|implementation-notes": {"body": "<p>Tato stránka obsahuje poznámky k implementaci konziliární žádanky a žádanky o fyzioterapii. Týkají se sestavení FHIR Bundle a naplnění jeho profilů daty.</p>\n<h4 id=\"prehled\"><span class=\"secno\">10.1</span> Přehled</h4>\n<p>Oba typy eŽádanky jsou reprezentovány jako FHIR Bundle typu <code>document</code>, který obsahuje kompozici příslušného typu a všechny zdroje ve stromové struktuře zdrojů, na které se odkazuje, viz <a href=\"https://www.hl7.org/fhir/composition-operation-document.html\" target=\"_blank\" rel=\"noopener\">$document operation</a>. V jednom bundlu je vždy právě jedna kompozice: u typu K <code>KOrderCompositionCz</code>, u typu FT <code>FTOrderCompositionCz</code>.</p>\n<pre class=\"code\">classDiagram\n  direction LR\n  class BundleOrderCz{\n    &lt;&lt;Bundle&gt;&gt;\n  }\n  BundleOrderCz *-- \"0..1\" KOrderCompositionCz\n  BundleOrderCz *-- \"0..1\" FTOrderCompositionCz\n  BundleOrderCz *-- \"1\" CZ_PatientCore\n  BundleOrderCz *-- \"1..*\" KOrderServiceRequestCz\n  BundleOrderCz *-- \"1..*\" FTServiceRequestCz\n  BundleOrderCz *-- \"1..*\" CZ_Coverage\n  BundleOrderCz *-- \"0..*\" CZ_ConditionCore\n  BundleOrderCz *-- \"0..*\" CZ_PractitionerCore\n  BundleOrderCz *-- \"0..*\" CZ_PractitionerRoleOrder\n  BundleOrderCz *-- \"0..*\" CZ_OrganizationCore\n  BundleOrderCz *-- \"0..*\" CZ_ObservationOrder\n  BundleOrderCz *-- \"0..*\" CZ_Attachment\n\n  KOrderCompositionCz --&gt; CZ_PatientCore: subject\n  KOrderCompositionCz --&gt; CZ_PractitionerRoleOrder: author\n  KOrderCompositionCz --&gt; CZ_OrganizationCore: custodian\n  KOrderCompositionCz --&gt; KOrderServiceRequestCz: section[orderInformation]\n  KOrderCompositionCz --&gt; CZ_Coverage: section[coverage]\n  KOrderCompositionCz --&gt; CZ_ConditionCore: section[significantMedicalHistory]\n  KOrderCompositionCz --&gt; CZ_ObservationOrder: section[supportingInformation]\n  KOrderCompositionCz --&gt; CZ_Attachment: section[attachments]\n\n  FTOrderCompositionCz --&gt; CZ_PatientCore: subject\n  FTOrderCompositionCz --&gt; CZ_PractitionerRoleOrder: author\n  FTOrderCompositionCz --&gt; FTServiceRequestCz: section[orderInformation]\n  FTOrderCompositionCz --&gt; CZ_Coverage: section[coverage]\n  FTOrderCompositionCz --&gt; CZ_Attachment: section[attachments]</pre>\n<p>Obsah jednotlivých sekcí a význam prvků jsou uvedeny na stránce <a href=\"#/k-order/scope-and-content-cs#koncepční-pohled\">Rozsah použití a obsah</a> a v definicích logických modelů, viz <a href=\"#/k-order/logical-models-cs\">Logické modely</a>. Tato stránka je neopakuje.</p>\n<h4 id=\"jeden-pozadovany-vykon-jeden-zdroj-pozadovane-sluzby\"><span class=\"secno\">10.2</span> Jeden požadovaný výkon, jeden zdroj požadované služby</h4>\n<p>Jednomu požadovanému výkonu odpovídá jeden zdroj požadované služby, tedy jeden <code>ServiceRequest</code>, a všechny se odkazují ze sekce <code>section[orderInformation]</code>. Kardinalita <code>1..*</code> znamená, že jedna eŽádanka může nést více požadovaných výkonů — u typu K například konziliární vyšetření a echokardiografii, u typu FT jednotlivé řádky poukazu.</p>\n<p>U typu FT je počet a frekvence provedení vlastností konkrétního požadovaného výkonu, ne dokumentu jako celku. Nese je proto zdroj požadované služby, nikoli kompozice.</p>\n<h4 id=\"sekce-kompozice-u-typu-k\"><span class=\"secno\">10.3</span> Sekce kompozice u typu K</h4>\n<p>Prvky <code>A.3.2.2</code> až <code>A.3.2.6</code> konziliární žádanky nesou samostatné sekce kompozice. Následující tabulka uvádí jejich vazbu, protože z názvu sekce není zřejmá.</p>\n<table class=\"grid\">\n<thead><tr><th>Prvek</th><th>Sekce kompozice</th><th>Kód sekce</th><th>Čím je sekce naplněna</th></tr></thead><tbody>\n<tr><td><code>A.3.2.2</code> Závažná anamnestická data</td><td><code>section[significantMedicalHistory]</code></td><td>LOINC <code>11348-0</code></td><td>odkazy na diagnózy</td></tr>\n<tr><td><code>A.3.2.3</code> Výsledky provedených vyšetření</td><td><code>section[examinationResults]</code></td><td>LOINC <code>30954-2</code></td><td>odkazy na nálezy</td></tr>\n<tr><td><code>A.3.2.4</code> Diferenciálně diagnostická rozvaha</td><td><code>section[differentialDiagnosis]</code></td><td>LOINC <code>51848-0</code></td><td>odkazy na diagnózy</td></tr>\n<tr><td><code>A.3.2.5</code> Současná léčba, medikace včetně dávkování</td><td><code>section[currentTreatment]</code></td><td>LOINC <code>11506-3</code></td><td>odkazy na medikaci</td></tr>\n<tr><td><code>A.3.2.6</code> Zapůjčená dokumentace</td><td><code>section[referencedDocumentation]</code></td><td>LOINC <code>77599-9</code></td><td>odkazy na dokumenty</td></tr>\n</tbody></table>\n<p>U typu FT nese prvek <code>A.3.2.2 Cíl vyšetření</code> sekce <code>section[goals]</code> s kódem LOINC <code>61146-7</code>. Klinické odůvodnění, tedy stav vyžadující terapii, cíl a rizika, nese u typu FT sekce <code>section[reasons]</code> textem, protože pro celý poukaz je společné.</p>\n<p>Nejsou-li pro povinnou sekci k dispozici žádná data, vyjádří se důvod v <code>composition.section.emptyReason</code>.</p>\n<h4 id=\"dusledky-nemennosti-pro-sestaveni-bundlu\"><span class=\"secno\">10.4</span> Důsledky neměnnosti pro sestavení bundlu</h4>\n<p>Bundle je sestaven a podepsán při vystavení a dál se nemění, viz <a href=\"#/k-order/workflow-cs\">Workflow</a>. Neměnnost je vlastností dokumentu, ale to, které údaje se v průběhu zpracování mění, určuje systém, kterým se dokument vyměňuje. Následující dva důsledky proto platí v kontextu systému eŽádanka, tedy české implementace.</p>\n<ol>\n<li><strong>Údaje, které se v průběhu zpracování mění, do bundlu nepatří.</strong> Byl-li v prvku <code>A.1.6 Provádějící</code> uveden doporučený poskytovatel a péči nakonec poskytne jiný, zůstává v dokumentu i nadále ten původní. Totéž platí pro rozesílání výsledku vůči prvku <code>A.1.7 Příjemce nálezu</code>.</li>\n<li><strong>Doplnění obsahu se neprovádí novou verzí dokumentu.</strong> Prvek <code>A.2.5 Termín návštěvy</code> nese termín požadovaný nebo dohodnutý při vystavení, nikoli termín, na který byl pacient objednán později. U typu FT to platí i pro terapeutický plán sestavený terapeutem v modelu s delegovaným rozsahem: terapeut jej zaznamenává do vlastní zdravotnické dokumentace, ne do eŽádanky.</li>\n</ol>\n<h4 id=\"identifikatory\"><span class=\"secno\">10.5</span> Identifikátory</h4>\n<p>V dokumentu i mimo něj vystupují tři různé identifikátory, které je třeba odlišit.</p>\n<table class=\"grid\">\n<thead><tr><th>Identifikátor</th><th>Kde je</th><th>K čemu je</th></tr></thead><tbody>\n<tr><td><code>A.2.1.1</code> ID objednávky</td><td>v dokumentu, prvek logického modelu</td><td>Identifikuje objednávku v systému žadatele. Přiděluje jej odesílající systém při sestavení dokumentu.</td></tr>\n<tr><td>Systémový identifikátor eŽádanky (<code>id</code>, UUID)</td><td>mimo dokument, přiděluje systém eŽádanky při uložení</td><td>Jednoznačně identifikuje eŽádanku v celém ekosystému. Navazující klinické dokumenty jej používají pro odkaz na původní eŽádanku.</td></tr>\n<tr><td>Kód eŽádanky (osm alfanumerických znaků)</td><td>mimo dokument, přiděluje systém eŽádanky při uložení</td><td>Sděluje se pacientovi a slouží k uplatnění eŽádanky u poskytovatele vyžádané péče.</td></tr>\n</tbody></table>\n<p>Systémový identifikátor ani kód nejsou součástí FHIR Bundle, protože v okamžiku jeho sestavení a podpisu ještě neexistují.</p>\n<h4 id=\"podpis-dokumentu\"><span class=\"secno\">10.6</span> Podpis dokumentu</h4>\n<p>Prvek <code>A.1.9 Elektronické podpisy</code> nese elektronický podpis nebo pečeť dokumentu a časové razítko. Osoba, která žádanku sepsala, a osoba, která ji podepsala, jsou v dokumentu identifikovány bezvýznamovým identifikátorem zdravotnického pracovníka a nemusí to být tatáž osoba.</p>\n<p>Způsob podpisu ani jeho ověření tato příručka nepopisuje. Řídí se obecnou metodikou pro podpis dokumentů ve formátu FHIR.</p>\n<h4 id=\"prijeti-se-zobecnenim-pozadovane-pece\"><span class=\"secno\">10.7</span> Přijetí se zobecněním požadované péče</h4>\n<p>Koncepty v oborech hodnot <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">korder-procedures-vs</span> a <span class=\"art\" title=\"odkaz na artefakt IG, v náhledu neaktivní\">ft-order-procedures-vs</span> jsou uspořádány hierarchicky, takže lze odvodit, že požadovaný koncept je podřazen konceptu, se kterým pracuje provádějící pracoviště, a požadavek přijmout. Původní kódovaná informace i její textová podoba přitom musí zůstat pro provádějícího viditelné. Informační systém žadatele musí podporovat celý obor hodnot požadované péče, přípustné je nabízet při zadávání pouze podvýběr.</p>\n<p>Je-li požadovaná péče vyjádřena výkonem zdravotní pojišťovny, zobecnění tímto způsobem provést nelze, protože tyto číselníky hierarchii konceptů nemají.</p>", "num": 10, "toc": [{"l": 3, "t": "Přehled", "s": "prehled"}, {"l": 3, "t": "Jeden požadovaný výkon, jeden zdroj požadované služby", "s": "jeden-pozadovany-vykon-jeden-zdroj-pozadovane-sluzby"}, {"l": 3, "t": "Sekce kompozice u typu K", "s": "sekce-kompozice-u-typu-k"}, {"l": 3, "t": "Důsledky neměnnosti pro sestavení bundlu", "s": "dusledky-nemennosti-pro-sestaveni-bundlu"}, {"l": 3, "t": "Identifikátory", "s": "identifikatory"}, {"l": 3, "t": "Podpis dokumentu", "s": "podpis-dokumentu"}, {"l": 3, "t": "Přijetí se zobecněním požadované péče", "s": "prijeti-se-zobecnenim-pozadovane-pece"}], "title": "Poznámky k implementaci", "file": "implementation-notes-cs.md", "changes": ["Nová stránka. Menu ji dosud mělo zakomentované a soubor neexistoval.", "Osnova je stejná jako u img-order: Přehled s diagramem bundlu, Důsledky neměnnosti, Identifikátory, Podpis dokumentu a Přijetí se zobecněním.", "V Přehledu je uvedeno, že v jednom bundlu je vždy právě jedna kompozice, u typu K KOrderCompositionCz a u typu FT FTOrderCompositionCz.", "Nové: oddíl Jeden požadovaný výkon, jeden zdroj požadované služby. U typu FT nese počet a frekvenci provedení zdroj požadované služby, ne kompozice.", "Nové: tabulka vazby prvků A.3.2.2 až A.3.2.6 na sekce kompozice u typu K, včetně kódů LOINC a toho, čím je která sekce naplněna. Z názvů sekcí ta vazba není zřejmá.", "Doplněno, že u typu FT nese prvek A.3.2.2 Cíl vyšetření sekce goals a že klinické odůvodnění nese sekce reasons textem, protože je pro celý poukaz společné.", "Oddíl Důsledky neměnnosti je výslovně omezen na kontext systému eŽádanka, tedy na českou implementaci. U typu FT je doplněno, že totéž platí pro terapeutický plán sestavený terapeutem.", "Doplněno, že u výkonů zdravotních pojišťoven nelze přijetí se zobecněním provést, protože tyto číselníky nemají hierarchii konceptů.", "Anglická verze srovnaná s českou: shodná osnova i shodný obsah, s ponechanými původními anglickými názvy oddílů."]}, "k-order|en|index": {"body": "<h4 id=\"introduction\"><span class=\"secno\">1.1</span> Introduction</h4>\n<p>This implementation guide is based on <a href=\"https://hl7.org/fhir/R4/\" target=\"_blank\" rel=\"noopener\">FHIR version R4</a> and defines a common framework for electronic request documents, that is eReferrals, in the Czech national context. It is prepared in accordance with the European eHN guidelines and the Xt-EHR concepts.</p>\n<p>On top of that common framework the guide defines <strong>two types of eReferral</strong>:</p>\n<ul>\n<li>the <strong>consultation order, type K</strong>, by which the requesting physician asks for the expert opinion of a specialist, for an examination or treatment by a specialist, or recommends that the patient be taken into ambulatory or inpatient care,</li>\n<li>the <strong>physiotherapy order, type FT</strong>, by which the treating physician requests physiotherapy or occupational therapy.</li>\n</ul>\n<p>Both types are part of the patient's medical records and authorise the requested health service, so where the care is covered by public health insurance they are a precondition of its reimbursement. The statutory definition of the eReferral and the regulations governing its content are stated in the References chapter.</p>\n<p>The guide defines the content components of the document and the structure in which it is assembled: the logical model, its mapping to FHIR profiles and resources, the structure of the FHIR Bundle, the value sets and examples of instances. The aim is for the eReferral to be electronically exchangeable between healthcare providers, their information systems and the national e-health infrastructure.</p>\n<p>In the future the common framework is expected to be extended to other types of request documents, such as the laboratory order.</p>\n<h5 id=\"common-skeleton-and-type-specific-differences\"><span class=\"secno\">1.1.1</span> Common skeleton and type-specific differences</h5>\n<p>Both types are built on a single skeleton of the logical model. They share the document header <code>A.1</code>, the document body <code>A.2</code>, the presented form <code>A.4</code> and the attachments <code>A.5</code>, and they <strong>differ only in section <code>A.3</code></strong>, specifically in the element <code>A.3.2 Order data elements</code>, which carries the definition of the requested care specific to the given type.</p>\n<p>
